name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Inject run number into web code
        run: |
          sed -i -E "s/build: [0-9]+/build: ${{ github.run_number }}/" www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version code from run number
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Configure fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('android/app/build.gradle', 'utf8');
            const signingBlock = \`
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
\`;
            content = content.replace(/android\s*\{/, 'android {' + signingBlock);
            content = content.replace(/buildTypes\s*\{/, 'buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }');
            fs.writeFileSync('android/app/build.gradle', content);
          "

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Muhasabati.apk

      - name: Verify APK Signature Fingerprint
        run: |
          keytool -printcert -jarfile Muhasabati.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhasabati-apk
          path: Muhasabati.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "محاسبتي - إصدار جديد (v${{ github.run_number }})"
          body: |
            تحديث جديد لتطبيق **محاسبتي** (الإصدار v${{ github.run_number }}).
            
            📥 **رابط التحميل المباشر للـ APK:**
            [اضغط هنا لتحميل Muhasabati.apk مباشرة](https://github.com/KhaledAlaa643/Muhasabati/releases/latest/download/Muhasabati.apk)
            
            يمكنك تثبيت هذا الإصدار مباشرة فوق تطبيقك الحالي دون فقد بياناتك السابقة.
          files: Muhasabati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

