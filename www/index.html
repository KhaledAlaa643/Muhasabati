<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1E5B4E">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="محاسبتي">
  <meta name="format-detection" content="telephone=no">
  <title>محاسبتي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    /* --- benefit banner slider --- */
    .benefit-banner {
      margin: 10px 16px 0;
      padding: 14px 16px 12px;
      background: #FFFFFF;
      border: 1.5px solid var(--pine);
      border-right: 5px solid var(--pine);
      border-radius: 16px;
      color: var(--ink);
      position: relative;
      overflow: hidden;
      user-select: none;
      touch-action: pan-y;
      box-shadow: 0 3px 12px rgba(30, 91, 78, .08)
    }

    .benefit-banner::before {
      content: '';
      position: absolute;
      top: -24px;
      left: -24px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 91, 78, .06) 0%, transparent 70%);
      pointer-events: none
    }

    .benefit-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .benefit-label {
      font-size: .76rem;
      font-weight: 800;
      background: var(--pine);
      color: var(--pine-ink);
      padding: 3px 11px;
      border-radius: 99px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .1)
    }

    .benefit-controls {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .benefit-counter {
      font-size: .78rem;
      color: var(--ink2);
      font-weight: 800;
      min-width: 32px;
      text-align: center
    }

    .benefit-nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s
    }

    .benefit-nav-btn:active {
      background: var(--pine);
      color: var(--pine-ink);
      border-color: var(--pine)
    }

    .benefit-content {
      min-height: 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 0
    }

    .benefit-text {
      font-weight: 700;
      font-size: 1.02rem;
      line-height: 1.7;
      color: #061F18
    }

    .benefit-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line)
    }

    .benefit-src {
      font-size: .84rem;
      color: var(--pine);
      font-weight: 800
    }

    .benefit-dots {
      display: flex;
      gap: 5px;
      align-items: center
    }

    .benefit-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
      transition: all .2s ease
    }

    .benefit-dot.active {
      width: 18px;
      border-radius: 4px;
      background: var(--pine)
    }

    @media (prefers-color-scheme: dark) {
      .benefit-banner {
        background: linear-gradient(135deg, #0E241E 0%, #081713 100%);
        border-color: var(--pine);
        border-right-color: var(--pine);
        box-shadow: 0 4px 16px rgba(0, 0, 0, .35)
      }

      .benefit-banner::before {
        background: radial-gradient(circle, rgba(255, 255, 255, .05) 0%, transparent 70%)
      }

      .benefit-text {
        color: #FFFFFF
      }

      .benefit-label {
        background: var(--saffron);
        color: #1A1305
      }

      .benefit-src {
        color: var(--saffron)
      }

      .benefit-counter {
        color: var(--ink2)
      }

      .benefit-nav-btn {
        background: rgba(255, 255, 255, .12);
        border-color: rgba(255, 255, 255, .2);
        color: #FFFFFF
      }

      .benefit-nav-btn:active {
        background: var(--saffron);
        color: #1A1305;
        border-color: var(--saffron)
      }

      .benefit-bottom {
        border-top-color: rgba(255, 255, 255, .12)
      }

      .benefit-dot {
        background: rgba(255, 255, 255, .25)
      }

      .benefit-dot.active {
        background: var(--saffron)
      }
    }

    /* --- help tooltip & field header --- */
    .f-block {
      margin-top: 14px
    }

    .f-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .f-lbl {
      font-size: .9rem;
      font-weight: 700;
      color: var(--ink2);
      display: inline-flex;
      align-items: center
    }

    .help-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--pine);
      color: var(--pine);
      font-size: .75rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      background: none;
      line-height: 1;
      transition: all .15s
    }

    .help-btn:hover,
    .help-btn:active {
      background: var(--pine);
      color: var(--pine-ink)
    }

    .tip-popup {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(80px + env(safe-area-inset-bottom));
      max-width: 320px;
      width: 90%;
      background: var(--ink);
      color: var(--surface);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: .88rem;
      line-height: 1.6;
      z-index: 40;
      animation: fadeIn .2s ease-out
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0)
      }
    }

    .tip-popup .tip-title {
      font-weight: 800;
      margin-bottom: 4px
    }

    .item-del {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink2);
      opacity: .55;
      flex-shrink: 0;
      transition: opacity .15s, color .15s
    }

    .item-del:hover,
    .item-del:active {
      opacity: 1;
      color: var(--bad)
    }

    .btn.danger {
      color: var(--bad);
      border-color: var(--bad)
    }

    .btn.danger:active {
      background: var(--bad);
      color: #fff
    }

    /* --- charts --- */
    .chart-tabs {
      display: flex;
      gap: 6px;
      margin: 12px 0 6px;
      flex-wrap: wrap
    }

    .chart-tab {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--line);
      font-size: .82rem;
      font-weight: 700;
      background: var(--surface);
      color: var(--ink2)
    }

    .chart-tab.active {
      background: var(--pine);
      border-color: var(--pine);
      color: var(--pine-ink)
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 120px;
      padding: 0 2px;
      margin-top: 12px
    }

    .chart-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      gap: 3px;
      height: 100%
    }

    .chart-bar-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      width: 100%
    }

    .chart-bar {
      width: 100%;
      border-radius: 6px 6px 0 0;
      background: var(--pine);
      min-height: 3px;
      transition: height .3s ease
    }

    .chart-bar.zero {
      background: var(--soft)
    }

    .chart-lbl {
      font-size: .65rem;
      color: var(--ink2);
      font-weight: 700;
      text-align: center
    }

    .chart-pct {
      font-size: .68rem;
      color: var(--pine);
      font-weight: 800;
      text-align: center;
      height: 14px
    }

    .chart-legend {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .chart-legend span {
      font-size: .78rem;
      color: var(--ink2);
      display: flex;
      align-items: center;
      gap: 5px
    }

    .chart-legend i {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 3px
    }

    .chart-filter-box {
      margin: 12px 0 10px;
    }

    .chart-select {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: .92rem;
      color: var(--ink);
      width: 100%;
      cursor: pointer;
    }

    .chart-select:focus {
      border-color: var(--pine);
    }

    .progress-card {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 14px;
    }

    .progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .progress-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--ink);
    }

    .progress-desc {
      font-size: .88rem;
      line-height: 1.55;
      color: var(--ink2);
      margin-top: 8px;
    }

    .progress-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-size: .82rem;
    }

    .progress-meta-item {
      background: var(--soft);
      padding: 4px 10px;
      border-radius: 8px;
      color: var(--ink);
      font-weight: 600;
    }

    /* --- quick lists --- */
    .qlist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px
    }

    .qlist-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      text-align: right;
      transition: border-color .15s
    }

    .qlist-card:active {
      border-color: var(--pine)
    }

    .qlist-icon {
      font-size: 1.6rem;
      margin-bottom: 6px
    }

    .qlist-name {
      font-weight: 800;
      font-size: .95rem
    }

    .qlist-count {
      font-size: .78rem;
      color: var(--ink2);
      margin-top: 2px
    }

    /* --- contact --- */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 12px
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0
    }

    .contact-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0
    }

    .contact-icon.wa {
      background: #25D366;
    }

    .contact-icon.tg {
      background: #229ED9;
    }

    .contact-info {
      flex: 1
    }

    .contact-name {
      font-weight: 800;
      font-size: .95rem
    }

    .contact-handle {
      font-size: .82rem;
      color: var(--ink2)
    }

    .contact-btn {
      min-height: 38px;
      padding: 6px 14px;
      border-radius: 10px;
      background: var(--pine);
      color: var(--pine-ink);
      border: none;
      font-weight: 700;
      font-size: .85rem
    }

    .contact-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0
    }

    :root {
      --bg: #EBF0EE;
      --surface: #FAFBFA;
      --ink: #14302A;
      --ink2: #566D66;
      --line: #D1DCD8;
      --soft: #DFE8E5;
      --pine: #1E5B4E;
      --pine-ink: #FFFFFF;
      --saffron: #C97F12;
      --ok: #2C8A6C;
      --bad: #B4483B;
      --overlay: rgba(12, 26, 22, .52);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1A17;
        --surface: #15241F;
        --ink: #E4EFEB;
        --ink2: #93A9A2;
        --line: #264039;
        --soft: #1D302A;
        --pine: #5CBFA4;
        --pine-ink: #0E1A17;
        --saffron: #E8B04E;
        --ok: #5CBFA4;
        --bad: #E48C7E;
        --overlay: rgba(0, 0, 0, .6);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      font-family: "Tajawal", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0
    }

    :focus-visible {
      outline: 3px solid var(--saffron);
      outline-offset: 2px;
      border-radius: 6px
    }

    .t {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block
    }

    .ico {
      display: inline-flex;
      vertical-align: middle
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 160px;
      padding-bottom: calc(160px + env(safe-area-inset-bottom))
    }

    .top {
      padding: 16px 18px 4px;
      padding: calc(16px + env(safe-area-inset-top)) 18px 4px
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--pine)
    }

    .page {
      padding: 6px 16px 0
    }

    .banner {
      margin: 8px 16px 0;
      padding: 10px 12px;
      border: 1px solid var(--saffron);
      border-radius: 12px;
      font-size: .88rem
    }

    .datenav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 4px 0 10px
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink)
    }

    .icon-btn:active {
      background: var(--soft)
    }

    .datetxt {
      text-align: center;
      flex: 1
    }

    .dt-main {
      font-weight: 800;
      font-size: 1.12rem
    }

    .dt-sub {
      font-size: .85rem;
      color: var(--ink2)
    }

    .dt-hijri {
      color: var(--pine);
      font-weight: 700
    }

    .link {
      color: var(--pine);
      font-weight: 700;
      font-size: .88rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      min-height: 28px
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 18px 18px
    }

    .hero-top {
      display: flex;
      align-items: baseline;
      gap: 8px
    }

    .hero-num {
      font-size: 2.7rem;
      font-weight: 800;
      line-height: 1;
      color: var(--pine)
    }

    .hero-of {
      color: var(--ink2);
      font-weight: 600
    }

    .seg {
      display: flex;
      gap: 3px;
      height: 12px;
      margin-top: 14px
    }

    .seg i {
      flex: 1;
      border-radius: 3px;
      background: var(--soft)
    }

    .seg i.on {
      background: var(--pine)
    }

    .hero-cap {
      margin-top: 10px;
      font-size: .92rem;
      color: var(--ink2)
    }

    .grp {
      margin: 20px 4px 4px;
      font-size: .85rem;
      font-weight: 700;
      color: var(--ink2)
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      transition: background .15s, transform .15s;
      position: relative
    }

    .item:last-child {
      border-bottom: 0
    }

    .item.dragging {
      opacity: .35;
      background: var(--soft);
      border-radius: 10px
    }

    .item.drag-over {
      border-top: 3px solid var(--pine) !important;
      background: rgba(30, 91, 78, .08)
    }

    .drag-handle {
      width: 32px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink2);
      opacity: .45;
      cursor: grab;
      touch-action: none;
      user-select: none;
      flex-shrink: 0;
      transition: opacity .15s, color .15s
    }

    .drag-handle:active {
      cursor: grabbing;
      opacity: 1;
      color: var(--pine)
    }

    .chk {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      background: var(--surface)
    }

    .chk.on {
      background: var(--pine);
      border-color: var(--pine);
      color: var(--pine-ink)
    }

    .chk.part {
      background: rgba(30, 91, 78, .12);
      border-color: var(--pine);
      color: var(--pine);
      font-weight: 800;
      font-size: .72rem
    }

    .item-meas-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: .78rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      margin-top: 4px;
      transition: all .15s
    }

    .item-meas-badge:active {
      transform: scale(.97);
      background: var(--line)
    }

    .item-meas-badge.part {
      background: rgba(201, 127, 18, .12);
      border-color: var(--saffron);
      color: var(--saffron)
    }

    .item-meas-badge.full {
      background: rgba(44, 138, 108, .12);
      border-color: var(--ok);
      color: var(--ok)
    }

    .meas-mini-bar {
      display: inline-block;
      width: 32px;
      height: 5px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      vertical-align: middle
    }

    .meas-mini-bar>i {
      display: block;
      height: 100%;
      background: var(--pine);
      border-radius: 99px
    }

    .item-meas-badge.part .meas-mini-bar>i {
      background: var(--saffron)
    }

    .item-meas-badge.full .meas-mini-bar>i {
      background: var(--ok)
    }

    .quick-chip {
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: .82rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all .15s
    }

    .quick-chip:active {
      background: var(--pine);
      color: var(--pine-ink);
      border-color: var(--pine)
    }

    .segmented-ctrl {
      display: flex;
      background: var(--soft);
      border-radius: 12px;
      padding: 4px;
      gap: 4px
    }

    .segmented-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 9px;
      border: none;
      background: none;
      font-weight: 700;
      font-size: .88rem;
      color: var(--ink2);
      cursor: pointer;
      transition: all .15s;
      text-align: center
    }

    .segmented-btn.active {
      background: var(--surface);
      color: var(--pine);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .08)
    }

    .item-body {
      flex: 1;
      min-width: 0;
      text-align: right;
      padding: 4px 0
    }

    .item-name {
      font-weight: 700
    }

    .item.done .item-name {
      color: var(--ink2);
      text-decoration: line-through;
      text-decoration-thickness: 1px
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: .82rem;
      color: var(--ink2);
      margin-top: 1px
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 0 8px
    }

    .now {
      background: var(--saffron);
      color: #fff;
      border-radius: 99px;
      padding: 0 8px;
      font-weight: 700
    }

    @media (prefers-color-scheme: dark) {
      .now {
        color: #1b1204
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 12px
    }

    .empty {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 20px 18px;
      margin-top: 14px
    }

    .empty h2 {
      margin: 0 0 6px;
      font-size: 1.1rem
    }

    .empty p {
      margin: 0 0 14px;
      color: var(--ink2)
    }

    .btnrow {

      }

      /* ---------- ثوابت وأدوات ---------- */
      const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

        { text: '﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنظُرْ نَفْسٌ مَّا قَدَّمَتْ لِغَدٍ ۖ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ﴾', src: 'سورة الحشر: 18', label: 'آية كريمة' },

        { text: '«احرص على ما ينفعك، واستعن بالله ولا تعجز»', src: 'رواه مسلم', label: 'حديث شريف' },

        { text: '«نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ»', src: 'رواه البخاري', label: 'حديث شريف' },

      function readText(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = no; r.readAsText(f); }); }

            .then(r => P.Share.share({ title: name, files: [r.uri] }))

      function buildICS(until) {
        const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Muhasabati//AR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
        const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');

          },
            h('div', { class: 'qlist-icon' }, ql.icon),
            h('div', { class: 'qlist-name' }, ql.name),
            h('div', { class: 'qlist-count' }, ql.items.length + ' عناصر'));
          grid.appendChild(card);
        });
        p.append(grid);
        return p;
      }
      function confirmAddList(ql) {
        const t = todayKey();
        const delta = (S.settings && S.settings.timeMode === 'summer') ? 1 : 0;
        const body = [
          h('p', { style: 'margin:14px 0 6px;font-size:.95rem' }, 'هتضاف ' + ql.items.length + ' عناصر من قائمة "' + ql.name + '" على عناصرك الحالية' + (delta ? ' (معدلة للتوقيت الصيفي)' : '') + ':'),
          h('ul', { style: 'margin:0 0 10px;padding-right:18px;font-size:.88rem;color:var(--ink2)' },
            ql.items.map(i => {
              const s = delta && i.start ? shiftHour(i.start, delta) : i.start;
              const e = delta && i.end ? shiftHour(i.end, delta) : i.end;
              return h('li', null, i.name + (s ? ' (' + s + (e ? ' - ' + e : '') + ')' : ''));
            }))
        ];
        openSheet('إضافة قائمة: ' + ql.name, body, [
          h('button', {
            class: 'btn primary', onclick: () => {
              ql.items.forEach(item => {
                const start = delta && item.start ? shiftHour(item.start, delta) : item.start;
                const end = delta && item.end ? shiftHour(item.end, delta) : item.end;
                S.items.push(Object.assign({ id: uid(), goal: null, since: t, target: 0, unit: '' }, item, { start, end }));
              });
              save(); closeSheet(); UI.tab = 'today'; render();
            }
          }, 'أضف الكل'),
          h('button', { class: 'btn', onclick: openQuickListsSheet }, 'رجوع')
        ]);
      }

      /* ---------- إحصاء ---------- */
      function getDayStats(k) {
        const items = itemsOn(k);
        if (!items.length) return null;
        let progSum = 0, fullDone = 0;
        items.forEach(i => {
          const p = getItemProgress(k, i);
          progSum += p;
          if (isItemDone(k, i)) fullDone++;
        });
        const pct = Math.min(100, Math.round((progSum / items.length) * 100));
        return { done: fullDone, progSum: Math.round(progSum * 10) / 10, total: items.length, pct };
      }
      function openCustomStatsSheet() {
        const selected = new Set(UI.chartCustomIds || []);
        const body = h('div', { class: 'custom-filter-sheet' });
        body.append(h('p', { class: 'hint', style: 'margin:0 0 14px;font-size:.88rem' }, 'اختر الأهداف أو المهام التي تريد متابعة تقدمها وإحصائياتها معاً:'));

        if (S.goals.length) {
          body.append(h('div', { class: 'grp', style: 'margin-top:4px' }, '🎯 أهداف صفحة الأهداف'));
          S.goals.forEach(g => {
            const gid = 'goal:' + g.id;
            const chk = h('input', { type: 'checkbox', id: 'c_g_' + g.id, checked: selected.has(gid), style: 'width:18px;height:18px;accent-color:var(--pine)' });
            chk.onchange = () => { if (chk.checked) selected.add(gid); else selected.delete(gid); };
            const lbl = h('label', { for: 'c_g_' + g.id, style: 'display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--line)' },
              chk, h('span', { style: 'font-weight:700;flex:1' }, g.name), g.target ? h('small', { style: 'color:var(--ink2)' }, num(g.target) + ' ' + g.unit) : null
            );
            body.append(lbl);
          });
        }

        if (S.items.length) {
          body.append(h('div', { class: 'grp', style: 'margin-top:16px' }, '📋 المهام والعادات اليومية'));
          S.items.forEach(it => {
            const iid = 'item:' + it.id;
            const chk = h('input', { type: 'checkbox', id: 'c_i_' + it.id, checked: selected.has(iid), style: 'width:18px;height:18px;accent-color:var(--pine)' });
            chk.onchange = () => { if (chk.checked) selected.add(iid); else selected.delete(iid); };
            const desc = it.target > 0 ? (' (' + num(it.target) + ' ' + (it.unit || '') + ')') : '';
            const lbl = h('label', { for: 'c_i_' + it.id, style: 'display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--line)' },
              chk, h('span', { style: 'flex:1' }, it.name + desc)
            );
            body.append(lbl);
          });
        }

        const foot = [
          h('button', {
            class: 'btn primary', onclick: () => {
              if (!selected.size) {
                UI.chartTarget = 'all';
                UI.chartCustomIds = [];
              } else {
                UI.chartTarget = 'custom';
                UI.chartCustomIds = Array.from(selected);
              }
              closeSheet();
              render();
            }
          }, 'تطبيق الاختيار (' + selected.size + ')'),
          h('button', { class: 'btn', onclick: closeSheet }, 'إلغاء')
        ];
        openSheet('تحديد مخصص للإحصائيات', body, foot);
      }

      function viewCharts() {
        const p = h('div', { class: 'page' });
        p.append(h('div', { class: 'sec' }, 'إحصائياتك'));

        // Validate target
        if (UI.chartTarget && UI.chartTarget.startsWith('goal:') && !S.goals.some(g => g.id === UI.chartTarget.slice(5))) {
          UI.chartTarget = 'all';
        }
        if (UI.chartTarget && UI.chartTarget.startsWith('item:') && !S.items.some(i => i.id === UI.chartTarget.slice(5))) {
          UI.chartTarget = 'all';
        }
        const currentTarget = UI.chartTarget || 'all';

        // 1. Time range tabs (week, month, 3months, 6months, year, custom)
        const ranges = [
          ['week', 'أسبوع'],
          ['month', 'شهر'],
          ['3months', '3 أشهر'],
          ['6months', '6 أشهر'],
          ['year', 'سنة'],
          ['custom', '📅 مخصصة']
        ];
        const tabsEl = h('div', { class: 'chart-tabs' });
        ranges.forEach(([id, label]) => {
          tabsEl.appendChild(h('button', {
            class: 'chart-tab' + (UI.chartRange === id ? ' active' : ''),
            onclick: () => { UI.chartRange = id; render(); }
          }, label));
        });
        p.append(tabsEl);

        // Custom Date Range Selector (shown when 'custom' range is active)
        if (UI.chartRange === 'custom') {
          const fromInput = h('input', {
            type: 'date',
            class: 'in',
            value: UI.chartCustomFrom || key(addDays(today(), -30)),
            style: 'font-weight:700'
          });
          const toInput = h('input', {
            type: 'date',
            class: 'in',
            value: UI.chartCustomTo || todayKey(),
            style: 'font-weight:700'
          });

          const updateDates = () => {
            if (fromInput.value && toInput.value) {
              if (fromInput.value > toInput.value) {
                toInput.value = fromInput.value;
              }
              UI.chartCustomFrom = fromInput.value;
              UI.chartCustomTo = toInput.value;
              render();
            }
          };

          fromInput.onchange = updateDates;
          toInput.onchange = updateDates;

          const fromVal = UI.chartCustomFrom || key(addDays(today(), -30));
          const toVal = UI.chartCustomTo || todayKey();
          const totalDaysCount = Math.max(1, diffDays(fromVal, toVal) + 1);

          const customBox = h('div', { class: 'card', style: 'margin:10px 0 12px;padding:12px 14px' },
            h('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' },
              h('span', { style: 'font-weight:800;font-size:.9rem;color:var(--pine)' }, '📅 تحديد فترة مخصصة:'),
              h('span', { class: 'pill', style: 'font-weight:700' }, totalDaysCount + ' يوماً')
            ),
            h('div', { class: 'two' },
              field('من تاريخ', fromInput),
              field('إلى تاريخ', toInput)
            ),
            h('div', { style: 'display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink2);margin-top:6px' },
              h('span', null, 'هجرياً: ' + fmtHijri(fromVal, false)),
              h('span', null, 'إلى: ' + fmtHijri(toVal, true))
            )
          );
          p.append(customBox);
        }

        // 2. Filter / Target selector
        const filterWrap = h('div', { class: 'chart-filter-box' });
        const scopeSelect = h('select', {
          class: 'chart-select',
          'aria-label': 'تصفية الإحصائيات حسب الهدف أو المهمة',
          onchange: () => {
            if (scopeSelect.value === 'custom') {
              openCustomStatsSheet();
            } else {
              UI.chartTarget = scopeSelect.value;
              render();
            }
          }
        });

        scopeSelect.appendChild(h('option', { value: 'all' }, '📊 جميع العناصر اليومية (الإنجاز العام)'));
        if (S.goals.length) {
          const gGrp = h('optgroup', { label: '🎯 أهداف صفحة الأهداف' });
          if (S.goals.length > 1) {
            gGrp.appendChild(h('option', { value: 'goals:all' }, '🎯 جميع أهداف صفحة الأهداف مجتمعة'));
          }
          S.goals.forEach(g => {
            gGrp.appendChild(h('option', { value: 'goal:' + g.id }, '🎯 هدف: ' + g.name + (g.target ? ' (' + num(g.target) + ' ' + g.unit + ')' : '')));
          });
          scopeSelect.appendChild(gGrp);
        }
        if (S.items.length) {
          const iGrp = h('optgroup', { label: '📋 المهام والعادات اليومية' });
          S.items.forEach(it => {
            const lbl = it.target > 0
              ? ('📋 مهمة: ' + it.name + ' (' + num(it.target) + ' ' + (it.unit || '') + ')')
              : ('📋 مهمة: ' + it.name);
            iGrp.appendChild(h('option', { value: 'item:' + it.id }, lbl));
          });
          scopeSelect.appendChild(iGrp);
        }
        scopeSelect.appendChild(h('option', { value: 'custom' }, '✨ تحديد مخصص (مجموعة محددة)...'));
        scopeSelect.value = currentTarget;
        filterWrap.appendChild(scopeSelect);

        if (currentTarget === 'custom') {
          const count = (UI.chartCustomIds || []).length;
          filterWrap.appendChild(h('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-top:6px' },
            h('span', { style: 'font-size:.82rem;color:var(--ink2)' }, 'مجموعة مخصصة: ' + count + ' عناصر محددة'),
            h('button', { class: 'link', style: 'font-size:.82rem', onclick: openCustomStatsSheet }, 'تعديل الاختيار...')
          ));
        }
        p.append(filterWrap);

        // 3. Generate dates for current and previous period
        let days = [];
        const t = today();
        if (UI.chartRange === 'week') { for (let i = 6; i >= 0; i--) days.push(key(addDays(t, -i))); }
        else if (UI.chartRange === 'month') { for (let i = 29; i >= 0; i--) days.push(key(addDays(t, -i))); }
        else if (UI.chartRange === '3months') { for (let i = 89; i >= 0; i--) days.push(key(addDays(t, -i))); }
        else if (UI.chartRange === '6months') { for (let i = 179; i >= 0; i--) days.push(key(addDays(t, -i))); }
        else if (UI.chartRange === 'year') { for (let i = 364; i >= 0; i--) days.push(key(addDays(t, -i))); }
        else if (UI.chartRange === 'custom') {
          const fromK = UI.chartCustomFrom || key(addDays(today(), -30));
          const toK = UI.chartCustomTo || todayKey();
          const totalDays = Math.max(1, diffDays(fromK, toK) + 1);
          const startD = parse(fromK);
          for (let i = 0; i < totalDays; i++) {
            days.push(key(addDays(startD, i)));
          }
        }
        else { for (let i = 6; i >= 0; i--) days.push(key(addDays(t, -i))); }

        const rangeLen = days.length;
        const firstDay = parse(days[0]);
        let prevDays = [];
        for (let i = rangeLen; i >= 1; i--) {
          prevDays.push(key(addDays(firstDay, -i)));
        }

        // 4. Group days into buckets for chart
        let buckets = [];
        if (UI.chartRange === 'week' || (UI.chartRange === 'custom' && days.length <= 10)) {
          buckets = days.map(k => {
            const d = parse(k);
            return {
              label: days.length <= 7 ? INIT[d.getDay()] : (d.getDate() + '/' + pad(d.getMonth() + 1)),
              subLabel: String(d.getDate()),
              days: [k],
              isToday: k === todayKey()
            };
          });
        } else if (UI.chartRange === 'month' || UI.chartRange === '3months' || (UI.chartRange === 'custom' && days.length <= 60)) {
          for (let i = 0; i < days.length; i += 7) {
            const slice = days.slice(i, i + 7);
            const d = parse(slice[0]);
            buckets.push({
              label: d.getDate() + '/' + pad(d.getMonth() + 1),
              subLabel: '',
              days: slice,
              isToday: slice.includes(todayKey())
            });
          }
        } else if (UI.chartRange === 'custom' && days.length <= 150) {
          for (let i = 0; i < days.length; i += 14) {
            const slice = days.slice(i, i + 14);
            const d = parse(slice[0]);
            buckets.push({
              label: d.getDate() + '/' + pad(d.getMonth() + 1),
              subLabel: '',
              days: slice,
              isToday: slice.includes(todayKey())
            });
          }
        } else {
          // 6months, year, or long custom range: group by calendar month
          const mGroups = {};
          days.forEach(k => {
            const ym = k.slice(0, 7);
            (mGroups[ym] = mGroups[ym] || []).push(k);
          });
          const keys = Object.keys(mGroups).sort();
          buckets = keys.map(ym => {
            const slice = mGroups[ym];
            const d = parse(slice[0]);
            return {
              label: MONTHS[d.getMonth()],
              subLabel: String(d.getFullYear()).slice(2),
              days: slice,
              isToday: slice.includes(todayKey())
            };
          });
        }

        // 5. Target Analysis
        const isGoalTarget = currentTarget.startsWith('goal:');
        const isAllGoals = currentTarget === 'goals:all';
        const isItemTarget = currentTarget.startsWith('item:');
        const isCustom = currentTarget === 'custom';

        const selectedGoal = isGoalTarget ? S.goals.find(g => g.id === currentTarget.slice(5)) : null;
        const selectedItem = isItemTarget ? S.items.find(i => i.id === currentTarget.slice(5)) : null;

        let statusChip = null;
        let statusTitle = '';
        let statusDesc = '';
        let summCards = [];
        let extraReportEl = null;
        let breakdownSec = null;
        let isUnitsMode = false;

        if (selectedGoal) {
          isUnitsMode = true;
          const g = selectedGoal;
          const o = pace(g);
          const curUnits = goalCount(g, days[0], days[days.length - 1]);
          const prevUnits = goalCount(g, prevDays[0], prevDays[prevDays.length - 1]);
          const unitDiff = curUnits - prevUnits;
          const dailyRate = curUnits / days.length;
          const weeklyRate = dailyRate * 7;

          buckets.forEach(b => {
            b.val = goalCount(g, b.days[0], b.days[b.days.length - 1]);
            b.hasData = b.val > 0;
            b.displayVal = b.val > 0 ? String(b.val) : '';
          });

          statusTitle = '🎯 تقدم هدف: ' + g.name;

          if (o.done) {
            statusChip = h('span', { class: 'pill ok' }, 'مكتمل بالكامل 🎉');
            statusDesc = 'مبروك! أتممت هذا الهدف بنجاح محققاً ' + num(o.total) + ' ' + g.unit + '.';
          } else if (o.overdue) {
            statusChip = h('span', { class: 'pill bad' }, 'الموعد انقضى ⚠️');
            statusDesc = 'الموعد النهائي المحدد للهدف (' + fmtDateWithHijri(g.deadline) + ') قد انقضى. المتبقي لإتمام الهدف ' + num(o.remaining) + ' ' + g.unit + '.';
          } else if (g.deadline && o.need) {
            if (dailyRate >= o.need) {
              statusChip = h('span', { class: 'pill ok' }, '⚡ متقدم وعلى المسار');
              statusDesc = 'أنت على المسار الصحيح! بمعدلك في هذه الفترة (' + num(dailyRate) + ' ' + g.unit + '/يوم) أنت تتجاوز المعدل المطلوب (' + num(o.need) + ' ' + g.unit + '/يوم) لإنهاء الهدف في موعده (' + fmtDateWithHijri(g.deadline) + ').';
            } else {
              statusChip = h('span', { class: 'pill bad' }, '⏳ متأخر عن الخطة');
              statusDesc = 'معدل إنجازك في هذه الفترة (' + num(dailyRate) + ' ' + g.unit + '/يوم) أقل من المعدل المطلوب (' + num(o.need) + ' ' + g.unit + '/يوم). تحتاج لزيادة إنجازك اليومي لتدارك التأخر وإنهاء الهدف في موعده (' + fmtDateWithHijri(g.deadline) + ').';
            }
          } else if (g.weekly) {
            const expected = Math.round((days.length / 7) * g.weekly);
            if (curUnits >= expected) {
              statusChip = h('span', { class: 'pill ok' }, '📈 متقدم عن الأسبوعي');
              statusDesc = 'حققت ' + num(curUnits) + ' ' + g.unit + ' في هذه الفترة متجاوزاً المستهدف المطلوب (' + expected + ' ' + g.unit + ').';
            } else {
              statusChip = h('span', { class: 'pill bad' }, '📉 متأخر عن الأسبوعي');
              statusDesc = 'حققت ' + num(curUnits) + ' ' + g.unit + ' في هذه الفترة، وهو أقل من المستهدف المطلوب (' + expected + ' ' + g.unit + ').';
            }
          } else {
            statusChip = h('span', { class: 'pill ok' }, 'مستمر في الإنجاز');
            statusDesc = 'أنجزت ' + num(curUnits) + ' ' + g.unit + ' في هذه الفترة بمعدل ' + num(weeklyRate) + ' ' + g.unit + '/أسبوعياً.';
          }

          extraReportEl = h('div', { class: 'progress-meta-row' });
          if (o.eta && !o.done) {
            extraReportEl.appendChild(h('span', { class: 'progress-meta-item' }, 'الموعد المتوقع للإنهاء: ' + fmtDateWithHijri(o.eta)));
          }
          if (g.deadline) {
            extraReportEl.appendChild(h('span', { class: 'progress-meta-item' }, 'الموعد النهائي: ' + fmtDateWithHijri(g.deadline)));
          }
          if (g.outcome) {
            extraReportEl.appendChild(h('span', { class: 'progress-meta-item' }, 'المخرج: ' + g.outcome));
          }

          summCards = [
            ['+' + num(curUnits) + ' ' + g.unit, 'منجز في الفترة'],
            [num(o.total) + (g.target ? (' من ' + num(g.target)) : '') + ' ' + g.unit, 'الإجمالي الكلي'],
            [(unitDiff > 0 ? ('+' + num(unitDiff)) : (unitDiff < 0 ? num(unitDiff) : '0')) + ' ' + g.unit, 'عن الفترة السابقة']
          ];

          const linked = S.items.filter(i => i.goal === g.id);
          if (linked.length) {
            breakdownSec = h('div', null,
              h('div', { class: 'sec' }, 'مساهمة المهام اليومية في هذا الهدف'),
              h('div', { class: 'card' },
                linked.map((it, idx) => {
                  let itDone = 0;
                  days.forEach(k => { if (isDone(k, it.id)) itDone++; });
                  return h('div', { style: 'display:flex;align-items:center;justify-content:space-between;padding:' + (idx ? '8px 0 0' : '0') + ';' + (idx ? 'border-top:1px solid var(--line);margin-top:8px' : '') },
                    h('div', null,
                      h('div', { style: 'font-weight:700;font-size:.92rem' }, it.name),
                      h('div', { style: 'font-size:.76rem;color:var(--ink2)' }, 'مهمة يومية مرتبطة بالهدف')
                    ),
                    h('span', { style: 'font-weight:800;color:var(--pine)' }, '+' + itDone + ' ' + g.unit)
                  );
                })
              )
            );
          }

        } else if (selectedItem) {
          const it = selectedItem;
          const isMeas = it.target > 0;
          let curDue = 0, curDone = 0, curUnits = 0;
          days.forEach(k => {
            if (runsOn(it, k)) {
              curDue++;
              curDone += getItemProgress(k, it);
              curUnits += getItemVal(k, it.id);
            }
          });
          const curPct = curDue ? Math.round(curDone / curDue * 100) : 0;

          let prevDue = 0, prevDone = 0, prevUnits = 0;
          prevDays.forEach(k => {
            if (runsOn(it, k)) {
              prevDue++;
              prevDone += getItemProgress(k, it);
              prevUnits += getItemVal(k, it.id);
            }
          });
          const prevPct = prevDue ? Math.round(prevDone / prevDue * 100) : 0;
          const delta = curPct - prevPct;
          const unitDiff = Math.round((curUnits - prevUnits) * 100) / 100;
          const dailyRate = Math.round((curUnits / days.length) * 100) / 100;

          if (isMeas) {
            isUnitsMode = true;
            buckets.forEach(b => {
              let sum = 0;
              b.days.forEach(k => { if (runsOn(it, k)) sum += getItemVal(k, it.id); });
              b.val = Math.round(sum * 100) / 100;
              b.hasData = sum > 0;
              b.displayVal = sum > 0 ? (num(b.val) + ' ' + (it.unit || '')) : '';
            });

            statusTitle = '📊 إنجاز مهمة: ' + it.name;
            const targetUnits = Math.round(curDue * it.target * 100) / 100;

            if (curPct >= 100) {
              statusChip = h('span', { class: 'pill ok' }, 'إنجاز ممتاز (' + curPct + '%) 🎉');
              statusDesc = 'ما شاء الله! حققت المستهدف بالكامل وزيادة، بإجمالي ' + num(curUnits) + ' ' + (it.unit || '') + ' من أصل ' + num(targetUnits) + ' ' + (it.unit || '') + ' مجدولة لهذه الفترة.';
            } else if (!prevDue) {
              statusChip = h('span', { class: 'pill ok' }, curPct + '% إنجاز');
              statusDesc = 'أنجزت ' + num(curUnits) + ' من أصل ' + num(targetUnits) + ' ' + (it.unit || '') + ' في هذه الفترة (' + curPct + '% من المستهدف بمعدل ' + num(dailyRate) + ' ' + (it.unit || '') + '/يوم).';
            } else if (unitDiff > 0) {
              statusChip = h('span', { class: 'pill ok' }, '📈 في ازدياد (+' + num(unitDiff) + ' ' + (it.unit || '') + ')');
              statusDesc = 'إنجازك في ازدياد! أنجزت ' + num(curUnits) + ' ' + (it.unit || '') + ' بزيادة +' + num(unitDiff) + ' ' + (it.unit || '') + ' عن الفترة السابقة المماثلة (نسبة الإنجاز ' + curPct + '%).';
            } else if (unitDiff < 0) {

            extraReportEl = h('div', { class: 'progress-meta-row' },
              h('span', { class: 'progress-meta-item' }, 'المستهدف اليومي: ' + num(it.target) + ' ' + (it.unit || '')),
              h('span', { class: 'progress-meta-item' }, 'المعدل اليومي: ' + num(dailyRate) + ' ' + (it.unit || '') + '/يوم'),

              b.hasData = bDue > 0;
              b.displayVal = bDue > 0 ? (b.val + '%') : '';
            });

            statusTitle = '📋 التزام مهمة: ' + it.name;

              statusChip = h('span', { class: 'pill ok' }, curPct + '% التزام');

            } else if (delta > 0) {
              statusChip = h('span', { class: 'pill ok' }, '📈 متقدم (+' + delta + '%)');
              statusDesc = 'أداؤك في تقدم ملحوظ! تحسن التزامك بنسبة +' + delta + '% مقارنة بالفترة السابقة المماثلة (ارتفع من ' + prevPct + '% إلى ' + curPct + '%).';
            } else if (delta < 0) {
              statusChip = h('span', { class: 'pill bad' }, '📉 متأخر (' + delta + '%)');
              statusDesc = 'تراجع التزامك بمهمة "' + it.name + '" بنسبة ' + Math.abs(delta) + '% مقارنة بالفترة السابقة المماثلة (انخفض من ' + prevPct + '% إلى ' + curPct + '%). حاول العودة للالتزام اليومي.';
            } else {
              statusChip = h('span', { class: 'pill' }, 'ثابت (' + curPct + '%)');
              statusDesc = 'حافظت على نفس نسبة الالتزام (' + curPct + '%) تماماً مثل الفترة السابقة المماثلة.';
            }

            extraReportEl = h('div', { class: 'progress-meta-row' },
              h('span', { class: 'progress-meta-item' }, 'الأيام المتتالية الحالية: ' + streak(it) + ' يوم'),
              it.goal ? (function () {
                const g = S.goals.find(x => x.id === it.goal);
                return g ? h('span', { class: 'progress-meta-item' }, 'مرتبطة بهدف: ' + g.name) : null;
              })() : null
            );

            summCards = [
              [curPct + '%', 'نسبة الالتزام'],
              [Math.round(curDone) + ' / ' + curDue, 'أيام الإنجاز'],
              [(delta > 0 ? ('+' + delta + '%') : (delta < 0 ? (delta + '%') : '0%')), 'عن الفترة السابقة']
            ];
          }

        } else if (isAllGoals) {
          isUnitsMode = true;
          let totalCur = 0, totalPrev = 0;
          S.goals.forEach(g => {
            totalCur += goalCount(g, days[0], days[days.length - 1]);
            totalPrev += goalCount(g, prevDays[0], prevDays[prevDays.length - 1]);
          });
          const deltaUnits = totalCur - totalPrev;

          buckets.forEach(b => {
            let sum = 0;
            S.goals.forEach(g => { sum += goalCount(g, b.days[0], b.days[b.days.length - 1]); });
            b.val = sum;
            b.hasData = sum > 0;
            b.displayVal = sum > 0 ? String(sum) : '';
          });

          statusTitle = '🎯 تقرير جميع الأهداف مجتمعة';
          if (deltaUnits >= 0) {
            statusChip = h('span', { class: 'pill ok' }, '📈 في ازدياد (+' + deltaUnits + ')');
            statusDesc = 'إجمالي ما أنجزته عبر جميع أهدافك في هذه الفترة هو ' + totalCur + ' وحدة (بزيادة +' + deltaUnits + ' وحدة عن الفترة السابقة المماثلة).';
          } else {
            statusChip = h('span', { class: 'pill bad' }, '📉 تراجع في الوتيرة (' + deltaUnits + ')');
            statusDesc = 'إجمالي ما أنجزته عبر جميع أهدافك في هذه الفترة هو ' + totalCur + ' وحدة (بانخفاض ' + Math.abs(deltaUnits) + ' وحدة عن الفترة السابقة المماثلة).';
          }

          summCards = [
            ['+' + totalCur, 'إجمالي المنجز في الفترة'],
            [String(S.goals.length), 'عدد الأهداف النشطة'],
            [(deltaUnits >= 0 ? ('+' + deltaUnits) : String(deltaUnits)), 'عن الفترة السابقة']
          ];

          breakdownSec = h('div', null,
            h('div', { class: 'sec' }, 'تفاصيل الأهداف في هذه الفترة'),
            h('div', { class: 'card' },

                const count = goalCount(g, days[0], days[days.length - 1]);
                const o = pace(g);
                return h('div', { style: 'padding:' + (idx ? '10px 0 0' : '0') + ';' + (idx ? 'border-top:1px solid var(--line);margin-top:10px' : '') },

                    h('div', { style: 'font-weight:700' }, g.name),
                    h('span', { class: 'pill ' + (o.done ? 'ok' : o.overdue ? 'bad' : o.late ? 'bad' : 'ok') },

                  )

        } else if (isCustom) {

          days.forEach(k => {
            chosenItems.forEach(it => { if (runsOn(it, k)) { cDue++; cDone += getItemProgress(k, it); } });
          });

          let pDue = 0, pDone = 0;
          prevDays.forEach(k => {
            chosenItems.forEach(it => { if (runsOn(it, k)) { pDue++; pDone += getItemProgress(k, it); } });
          });
          const prevPct = pDue ? Math.round(pDone / pDue * 100) : 0;
          const delta = curPct - prevPct;

          let goalsCurUnits = 0;
          chosenGoals.forEach(g => { goalsCurUnits += goalCount(g, days[0], days[days.length - 1]); });

          buckets.forEach(b => {
            let bDue = 0, bDone = 0;
            b.days.forEach(k => {
              chosenItems.forEach(it => { if (runsOn(it, k)) { bDue++; bDone += getItemProgress(k, it); } });
            });

            b.displayVal = bDue > 0 ? (b.val + '%') : '';
          });

          statusTitle = '✨ إحصائيات المجموعة المخصصة (' + selected.size + ' عناصر)';

          } else if (delta > 0) {
            statusChip = h('span', { class: 'pill ok' }, '📈 متقدم (+' + delta + '%)');
            statusDesc = 'أداؤك في هذه المجموعة في تقدم بنسبة +' + delta + '% مقارنة بالفترة السابقة المماثلة.';
          } else if (delta < 0) {
            statusChip = h('span', { class: 'pill bad' }, '📉 متأخر (' + delta + '%)');
            statusDesc = 'أداؤك في هذه المجموعة تراجع بنسبة ' + Math.abs(delta) + '% مقارنة بالفترة السابقة المماثلة.';
          } else {
            statusChip = h('span', { class: 'pill' }, 'ثابت (' + curPct + '%)');
            statusDesc = 'حافظت على نفس نسبة الالتزام (' + curPct + '%) مقارنة بالفترة السابقة المماثلة.';
          }

          summCards = [
            [curPct + '%', 'متوسط التزام المهام'],
            ['+' + goalsCurUnits, 'وحدات الأهداف المنجزة'],
            [(delta > 0 ? ('+' + delta + '%') : (delta < 0 ? (delta + '%') : '0%')), 'عن الفترة السابقة']
          ];

        } else {
          // Default: All daily items
          const curStats = days.map(k => ({ k, s: getDayStats(k) })).filter(x => x.s);
          const curAvg = curStats.length ? Math.round(curStats.reduce((s, x) => s + x.s.pct, 0) / curStats.length) : 0;
          const best = curStats.reduce((b, x) => (!b || x.s.pct > b.s.pct) ? x : b, null);

          const prevStats = prevDays.map(k => ({ k, s: getDayStats(k) })).filter(x => x.s);
          const prevAvg = prevStats.length ? Math.round(prevStats.reduce((s, x) => s + x.s.pct, 0) / prevStats.length) : 0;
          const delta = curAvg - prevAvg;

          buckets.forEach(b => {
            const ss = b.days.map(k => getDayStats(k)).filter(Boolean);
            b.val = ss.length ? Math.round(ss.reduce((s, x) => s + x.pct, 0) / ss.length) : 0;
            b.hasData = ss.length > 0;
            b.displayVal = ss.length > 0 ? (b.val + '%') : '';
          });

          statusTitle = '📊 تقرير الإنجاز اليومي العام';
          if (!prevStats.length) {
            statusChip = h('span', { class: 'pill ok' }, curAvg + '% متوسط الإنجاز');
            statusDesc = 'متوسط إنجازك اليومي في هذه الفترة هو ' + curAvg + '%.';
          } else if (delta > 0) {
            statusChip = h('span', { class: 'pill ok' }, '📈 متقدم (+' + delta + '%)');
            statusDesc = 'أداؤك العام في تصاعد! ارتفع متوسط إنجازك بنسبة +' + delta + '% مقارنة بالفترة السابقة المماثلة (من ' + prevAvg + '% إلى ' + curAvg + '%). استمر!';
          } else if (delta < 0) {
            statusChip = h('span', { class: 'pill bad' }, '📉 متأخر (' + delta + '%)');
            statusDesc = 'تراجع متوسط إنجازك العام بنسبة ' + Math.abs(delta) + '% مقارنة بالفترة السابقة المماثلة (انخفض من ' + prevAvg + '% إلى ' + curAvg + '%). حاول تنظيم وقتك لاستعادة الوتيرة.';
          } else {
            statusChip = h('span', { class: 'pill' }, 'ثابت (' + curAvg + '%)');
            statusDesc = 'أداؤك العام مستقر تماماً بنسبة ' + curAvg + '% مثل الفترة السابقة المماثلة.';
          }

          summCards = [
            [curAvg + '%', 'متوسط الإنجاز'],
            [best ? (best.s.pct + '%') : '–', 'أفضل يوم'],
            [(delta > 0 ? ('+' + delta + '%') : (delta < 0 ? (delta + '%') : '0%')), 'عن الفترة السابقة']
          ];

          const valid = curStats;
          if (valid.length) {
            const iStats = {};
            days.forEach(k => {
              itemsOn(k).forEach(i => {
                if (!iStats[i.id]) iStats[i.id] = { name: i.name, done: 0, due: 0 };
                iStats[i.id].due++;
                iStats[i.id].done += getItemProgress(k, i);
              });
            });
            const sorted = Object.keys(iStats).map(k => iStats[k]).filter(x => x.due >= 3).sort((a, b) => (b.done / b.due) - (a.done / a.due)).slice(0, 5);
            if (sorted.length) {
              breakdownSec = h('div', null,
                h('div', { class: 'sec' }, 'أكثر العناصر التزاماً'),
                h('div', { class: 'card' },
                  sorted.map((x, idx) => {
                    const pct = Math.round(x.done / x.due * 100);
                    const row = h('div', { style: 'display:flex;align-items:center;gap:10px;' + (idx ? 'margin-top:10px;padding-top:10px;border-top:1px solid var(--line)' : '') });
                    row.appendChild(h('span', { style: 'font-size:1.1rem;min-width:26px;text-align:center' }, ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'][idx]));
                    const info = h('div', { style: 'flex:1;min-width:0' });
                    info.appendChild(h('div', { style: 'font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, x.name));
                    const barEl = h('div', { class: 'bar', style: 'margin:4px 0 0;height:7px' });
                    barEl.appendChild(h('i', { style: 'width:' + pct + '%' }));
                    info.appendChild(barEl);
                    row.appendChild(info);
                    row.appendChild(h('span', { style: 'font-weight:800;color:var(--pine);font-size:.9rem;flex-shrink:0' }, pct + '%'));
                    return row;
                  })
                )
              );
            }
          }
        }

        // 6. Render Progress/Lag Report Card
        const repCard = h('div', { class: 'progress-card' },
          h('div', { class: 'progress-head' },
            h('div', { class: 'progress-title' }, statusTitle),
            statusChip
          ),
          h('div', { class: 'progress-desc' }, statusDesc),
          extraReportEl
        );
        p.append(repCard);

        // 7. Render 3 Summary Metric Cards
        const summRow = h('div', { style: 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px' });
        summCards.forEach(([v, l]) => {
          summRow.appendChild(h('div', { class: 'card', style: 'text-align:center;padding:12px 6px' },
            h('div', { style: 'font-size:1.25rem;font-weight:800;color:var(--pine);line-height:1.2' }, v),
            h('div', { style: 'font-size:.72rem;color:var(--ink2);margin-top:4px;font-weight:600' }, l)
          ));
        });
        p.append(summRow);

        // 8. Render Chart Bars
        const maxVal = Math.max(1, ...buckets.map(b => b.val || 0));
        const barsEl = h('div', { class: 'chart-bars' });
        buckets.forEach(b => {
          const col = h('div', { class: 'chart-col' });
          col.appendChild(h('div', { class: 'chart-pct' }, b.displayVal || ''));
          const bw = h('div', { class: 'chart-bar-wrap' });
          const bar = h('div', { class: 'chart-bar' + (!b.hasData || b.val === 0 ? ' zero' : '') });
          if (b.isToday) bar.style.background = 'var(--saffron)';
          const hPct = b.hasData ? Math.max(4, Math.round(b.val / (isUnitsMode ? maxVal : 100) * 100)) : 4;
          bar.style.height = hPct + '%';
          bw.appendChild(bar);
          col.appendChild(bw);
          const lblEl = h('div', { class: 'chart-lbl' }, b.label);
          if (b.subLabel && UI.chartRange === 'week') {
            lblEl.appendChild(h('b', { style: 'display:block;font-size:.65rem' }, b.subLabel));
          }
          col.appendChild(lblEl);
          barsEl.appendChild(col);
        });
        p.append(barsEl);

        // 9. Legend
        const legend = h('div', { class: 'chart-legend' });
        legend.appendChild(h('span', null, h('i', { style: 'background:var(--pine)' }), h('span', null, isUnitsMode ? 'الوحدات المنجزة' : 'الإنجاز')));
        legend.appendChild(h('span', null, h('i', { style: 'background:var(--saffron)' }), h('span', null, 'اليوم')));
        legend.appendChild(h('span', null, h('i', { style: 'background:var(--soft)' }), h('span', null, 'بدون بيانات')));
        p.append(legend);

        // 10. Breakdown section
        if (breakdownSec) p.append(breakdownSec);

        return p;
      }

      function itemEditor(it) {
        const isNew = !it;
        const d = Object.assign({ name: '', days: [0, 1, 2, 3, 4, 5, 6], start: '', end: '', goal: '', since: UI.tab === 'today' ? UI.date : todayKey(), target: 0, unit: '' }, it || {});

          { label: '⏳ ساعة', u: 'ساعة', def: 1 },
          { label: '🕌 ركعة', u: 'ركعة', def: 2 },
          { label: '📿 تسبيحة', u: 'تسبيحة', def: 100 },
          { label: '📜 آية', u: 'آية', def: 20 },
          { label: '📚 حديث', u: 'حديث', def: 3 }
        ];

        const presetChipsWrap = h('div', { style: 'display:flex;gap:5px;flex-wrap:wrap;margin-top:8px' });
        presetUnits.forEach(pu => {
          presetChipsWrap.appendChild(h('button', {

        measFieldsBox.append(

            field('المستهدف اليومي', targetInp, 'المستهدف|الكمية أو الوقت المطلوب إنجازه يومياً. مثال: 1 (لجزء واحد) أو 60 (لـ 60 دقيقة).'),
            field('وحدة القياس', unitInp, 'الوحدة|وحدة القياس مثل: جزء، دقيقة، صفحة، ركعة، إلخ.')
          ),
          h('div', { style: 'margin-top:6px' },
            h('div', { class: 'hint', style: 'font-size:.76rem;margin-bottom:4px' }, 'أو اختر وحدة شائعة بضغطة واحدة:'),
            presetChipsWrap
          )
        );

        const btnSimple = h('button', {

            btnMeas.classList.remove('active');
            measFieldsBox.style.display = 'none';
          }
        }, '✓ عادية (صح / خطأ)');

        const btnMeas = h('button', {
          type: 'button',
          class: 'segmented-btn' + (itemType === 'measurable' ? ' active' : ''),
          onclick: () => {
            itemType = 'measurable';

            btnSimple.classList.remove('active');

          }
        }, '⏱️ أو 📊 ذات كمية أو وقت');

        const typeSelector = h('div', { style: 'margin:14px 0 16px' },
          h('div', { class: 'f-lbl', style: 'margin-bottom:6px' }, 'طريقة متابعة المهمة'),
          h('div', { class: 'segmented-ctrl' }, btnSimple, btnMeas),
          measFieldsBox
        );

        const allDays = [0, 1, 2, 3, 4, 5, 6];
        const isAll = allDays.every(n => days.has(n));
        const isWork = [0, 1, 2, 3, 4].every(n => days.has(n)) && days.size === 5;
        const isWkend = [5, 6].every(n => days.has(n)) && days.size === 2;

      /* ---------- سحب وإفلات المهام ---------- */
      let activeDragId = null;
      function setupDrag(rowEl, handleEl, itemId) {
        rowEl.setAttribute('draggable', 'true');
        rowEl.dataset.id = itemId;

        rowEl.ondragstart = e => {
          activeDragId = itemId;
          e.dataTransfer.setData('text/plain', itemId);
          e.dataTransfer.effectAllowed = 'move';
          rowEl.classList.add('dragging');
        };
        rowEl.ondragend = () => {
          activeDragId = null;
          rowEl.classList.remove('dragging');
          document.querySelectorAll('.item.drag-over').forEach(el => el.classList.remove('drag-over'));
        };
        rowEl.ondragover = e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (activeDragId && activeDragId !== itemId) {
            rowEl.classList.add('drag-over');
          }
        };
        rowEl.ondragleave = () => {
          rowEl.classList.remove('drag-over');
        };
        rowEl.ondrop = e => {
          e.preventDefault();
          rowEl.classList.remove('drag-over');
          const srcId = e.dataTransfer.getData('text/plain') || activeDragId;
          if (srcId && srcId !== itemId) {
            moveItem(srcId, itemId);
          }
        };

        // سحب باللمس على شاشات الهواتف (Touch drag)
        let isTouchDragging = false, currentTargetEl = null;
        handleEl.addEventListener('touchstart', e => {
          if (e.touches.length !== 1) return;
          activeDragId = itemId;
          isTouchDragging = true;
          rowEl.classList.add('dragging');
          try { if (navigator.vibrate) navigator.vibrate(25); } catch (err) { }
        }, { passive: true });

        handleEl.addEventListener('touchmove', e => {
          if (!isTouchDragging || e.touches.length !== 1) return;
          const touch = e.touches[0];
          e.preventDefault();
          const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetRow = elemBelow ? elemBelow.closest('.item[data-id]') : null;
          if (currentTargetEl && currentTargetEl !== targetRow) {
            currentTargetEl.classList.remove('drag-over');
          }
          if (targetRow && targetRow.dataset.id !== itemId) {
            targetRow.classList.add('drag-over');
            currentTargetEl = targetRow;
          } else {
            currentTargetEl = null;
          }
        }, { passive: false });

        const endTouch = () => {
          if (!isTouchDragging) return;
          isTouchDragging = false;
          rowEl.classList.remove('dragging');
          if (currentTargetEl) {
            currentTargetEl.classList.remove('drag-over');
            const tgtId = currentTargetEl.dataset.id;
            if (tgtId && tgtId !== itemId) {
              moveItem(itemId, tgtId);
            }
            currentTargetEl = null;
          }
          activeDragId = null;
        };
        handleEl.addEventListener('touchend', endTouch);
        handleEl.addEventListener('touchcancel', endTouch);
      }

      function goalCard(g) {

        const lines = [];

          kids.push(renderUpdateBanner());
        }
        if (UI.tab === 'today') { kids.push(renderBenefitBanner()); }
        if (UI.tab === 'today') kids.push(viewToday());
        else if (UI.tab === 'goals') kids.push(viewGoals());
        else if (UI.tab === 'week') kids.push(viewWeek());
        else if (UI.tab === 'charts') kids.push(viewCharts());
        else kids.push(viewSettings());
        if (UI.tab === 'today' || UI.tab === 'goals')
          kids.push(h('button', { class: 'fab', 'aria-label': UI.tab === 'today' ? 'عنصر جديد' : 'هدف جديد', onclick: () => UI.tab === 'today' ? itemEditor(null) : goalEditor(null) }, icon('plus', 26)));
        kids.push(h('nav', { class: 'tabs', 'aria-label': 'التنقل' }, TABS.map(t => h('button', { class: 'tab', 'aria-current': UI.tab === t[0] ? 'page' : null, onclick: () => { UI.tab = t[0]; closeSheet(); removeTip(); render(); window.scrollTo(0, 0); } }, icon(t[2], 24), t[1]))));
        while (app.firstChild) app.removeChild(app.firstChild);
        kids.forEach(k => app.appendChild(k));
        window.scrollTo(0, y);
      }

      function isEditingInput() {
        try {
          var ae = document.activeElement;
          if (!ae) return false;
          var tag = (ae.tagName || '').toLowerCase();
          return tag === 'input' || tag === 'textarea' || tag === 'select';
        } catch (e) { return false; }
      }

      function startApp(d) {
        S = normalize(d); render();
        setInterval(() => { if (!sheetEl && UI.tab === 'today' && UI.date === todayKey() && !document.hidden && !isEditingInput()) render(); }, 60000);
        setInterval(() => { if (!sheetEl && UI.tab === 'today' && !document.hidden) changeBenefit(1); }, 7000);
        setTimeout(() => checkForUpdates(true), 2500);
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
            window.Capacitor.Plugins.App.addListener('backButton', () => {
              if (sheetEl) { closeSheet(); return; }
              if (tipEl) { removeTip(); return; }
              if (UI.tab !== 'today') { UI.tab = 'today'; render(); return; }
              window.Capacitor.Plugins.App.exitApp();
            });
          }
        } catch (e) { }
      }

      store.get().then(startApp).catch(function (err) {
        console.error('Storage load failed, falling back to blank state:', err);
        startApp(null);
      });
    })();
  </script>
</body>
