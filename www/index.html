<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1E5B4E">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>محاسبتي</title>
<style>
/* --- benefit banner slider --- */
.benefit-banner{margin:10px 16px 0;padding:14px 16px 12px;background:#FFFFFF;border:1.5px solid var(--pine);border-right:5px solid var(--pine);border-radius:16px;color:var(--ink);position:relative;overflow:hidden;user-select:none;touch-action:pan-y;box-shadow:0 3px 12px rgba(30,91,78,.08)}
.benefit-banner::before{content:'';position:absolute;top:-24px;left:-24px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(30,91,78,.06) 0%,transparent 70%);pointer-events:none}
.benefit-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.benefit-label{font-size:.76rem;font-weight:800;background:var(--pine);color:var(--pine-ink);padding:3px 11px;border-radius:99px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.benefit-controls{display:flex;align-items:center;gap:6px}
.benefit-counter{font-size:.78rem;color:var(--ink2);font-weight:800;min-width:32px;text-align:center}
.benefit-nav-btn{width:28px;height:28px;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.benefit-nav-btn:active{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.benefit-content{min-height:56px;display:flex;flex-direction:column;justify-content:center;padding:4px 0}
.benefit-text{font-weight:700;font-size:1.02rem;line-height:1.7;color:#061F18}
.benefit-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.benefit-src{font-size:.84rem;color:var(--pine);font-weight:800}
.benefit-dots{display:flex;gap:5px;align-items:center}
.benefit-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s ease}
.benefit-dot.active{width:18px;border-radius:4px;background:var(--pine)}
@media (prefers-color-scheme: dark){
  .benefit-banner{background:linear-gradient(135deg,#0E241E 0%,#081713 100%);border-color:var(--pine);border-right-color:var(--pine);box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .benefit-banner::before{background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%)}
  .benefit-text{color:#FFFFFF}
  .benefit-label{background:var(--saffron);color:#1A1305}
  .benefit-src{color:var(--saffron)}
  .benefit-counter{color:var(--ink2)}
  .benefit-nav-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#FFFFFF}
  .benefit-nav-btn:active{background:var(--saffron);color:#1A1305;border-color:var(--saffron)}
  .benefit-bottom{border-top-color:rgba(255,255,255,.12)}
  .benefit-dot{background:rgba(255,255,255,.25)}
  .benefit-dot.active{background:var(--saffron)}
}
/* --- help tooltip & field header --- */
.f-block{margin-top:14px}
.f-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.f-lbl{font-size:.9rem;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center}
.help-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--pine);color:var(--pine);font-size:.75rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:none;line-height:1;transition:all .15s}
.help-btn:hover,.help-btn:active{background:var(--pine);color:var(--pine-ink)}
.tip-popup{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));max-width:320px;width:90%;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:14px;font-size:.88rem;line-height:1.6;z-index:40;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.tip-popup .tip-title{font-weight:800;margin-bottom:4px}
.item-del{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);opacity:.55;flex-shrink:0;transition:opacity .15s,color .15s}
.item-del:hover,.item-del:active{opacity:1;color:var(--bad)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:active{background:var(--bad);color:#fff}
/* --- charts --- */
.chart-tabs{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.chart-tab{padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:.82rem;font-weight:700;background:var(--surface);color:var(--ink2)}
.chart-tab.active{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 2px;margin-top:12px}
.chart-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;height:100%}
.chart-bar-wrap{flex:1;display:flex;align-items:flex-end;width:100%}
.chart-bar{width:100%;border-radius:6px 6px 0 0;background:var(--pine);min-height:3px;transition:height .3s ease}
.chart-bar.zero{background:var(--soft)}
.chart-lbl{font-size:.65rem;color:var(--ink2);font-weight:700;text-align:center}
.chart-pct{font-size:.68rem;color:var(--pine);font-weight:800;text-align:center;height:14px}
.chart-legend{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.chart-legend span{font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:5px}
.chart-legend i{display:inline-block;width:11px;height:11px;border-radius:3px}
/* --- quick lists --- */
.qlist-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qlist-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:right;transition:border-color .15s}
.qlist-card:active{border-color:var(--pine)}
.qlist-icon{font-size:1.6rem;margin-bottom:6px}
.qlist-name{font-weight:800;font-size:.95rem}
.qlist-count{font-size:.78rem;color:var(--ink2);margin-top:2px}
/* --- contact --- */
.contact-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.contact-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.contact-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.contact-icon.wa{background:#25D366;}
.contact-icon.tg{background:#229ED9;}
.contact-info{flex:1}
.contact-name{font-weight:800;font-size:.95rem}
.contact-handle{font-size:.82rem;color:var(--ink2)}
.contact-btn{min-height:38px;padding:6px 14px;border-radius:10px;background:var(--pine);color:var(--pine-ink);border:none;font-weight:700;font-size:.85rem}
.contact-divider{height:1px;background:var(--line);margin:4px 0}
:root{
  --bg:#EBF0EE; --surface:#FAFBFA; --ink:#14302A; --ink2:#566D66; --line:#D1DCD8; --soft:#DFE8E5;
  --pine:#1E5B4E; --pine-ink:#FFFFFF; --saffron:#C97F12; --ok:#2C8A6C; --bad:#B4483B;
  --overlay:rgba(12,26,22,.52);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1A17; --surface:#15241F; --ink:#E4EFEB; --ink2:#93A9A2; --line:#264039; --soft:#1D302A;
    --pine:#5CBFA4; --pine-ink:#0E1A17; --saffron:#E8B04E; --ok:#5CBFA4; --bad:#E48C7E;
    --overlay:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
  font-family:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.t{direction:ltr;unicode-bidi:isolate;display:inline-block}
.ico{display:inline-flex;vertical-align:middle}

.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:160px;padding-bottom:calc(160px + env(safe-area-inset-bottom))}
.top{padding:16px 18px 4px;padding:calc(16px + env(safe-area-inset-top)) 18px 4px}
.brand{font-size:1.4rem;font-weight:800;color:var(--pine)}
.page{padding:6px 16px 0}
.banner{margin:8px 16px 0;padding:10px 12px;border:1px solid var(--saffron);border-radius:12px;font-size:.88rem}

.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:active{background:var(--soft)}
.datetxt{text-align:center;flex:1}
.dt-main{font-weight:800;font-size:1.12rem}
.dt-sub{font-size:.85rem;color:var(--ink2)}
.link{color:var(--pine);font-weight:700;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;min-height:28px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px 18px}
.hero-top{display:flex;align-items:baseline;gap:8px}
.hero-num{font-size:2.7rem;font-weight:800;line-height:1;color:var(--pine)}
.hero-of{color:var(--ink2);font-weight:600}
.seg{display:flex;gap:3px;height:12px;margin-top:14px}
.seg i{flex:1;border-radius:3px;background:var(--soft)}
.seg i.on{background:var(--pine)}
.hero-cap{margin-top:10px;font-size:.92rem;color:var(--ink2)}

.grp{margin:20px 4px 4px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);transition:background .15s,transform .15s;position:relative}
.item:last-child{border-bottom:0}
.item.dragging{opacity:.35;background:var(--soft);border-radius:10px}
.item.drag-over{border-top:3px solid var(--pine)!important;background:rgba(30,91,78,.08)}
.drag-handle{width:32px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);opacity:.45;cursor:grab;touch-action:none;user-select:none;flex-shrink:0;transition:opacity .15s,color .15s}
.drag-handle:active{cursor:grabbing;opacity:1;color:var(--pine)}
.chk{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}
.chk.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.item-body{flex:1;min-width:0;text-align:right;padding:4px 0}
.item-name{font-weight:700}
.item.done .item-name{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.item-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--ink2);margin-top:1px}
.tag{border:1px solid var(--line);border-radius:99px;padding:0 8px}
.now{background:var(--saffron);color:#fff;border-radius:99px;padding:0 8px;font-weight:700}
@media (prefers-color-scheme: dark){.now{color:#1b1204}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:20px 18px;margin-top:14px}
.empty h2{margin:0 0 6px;font-size:1.1rem}
.empty p{margin:0 0 14px;color:var(--ink2)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:40px;padding:6px 14px}

.goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal-name{font-weight:800;font-size:1.05rem}
.goal-out{font-size:.88rem;color:var(--ink2);margin-top:2px}
.pill{font-size:.76rem;padding:1px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--pine);border-radius:99px}
.bar.wk>i{background:var(--saffron)}
.goal-num{font-weight:800;font-size:1.25rem}
.goal-num small{font-weight:600;color:var(--ink2);font-size:.9rem}
.goal-lines{margin:6px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--ink2)}
.goal-lines li+li{margin-top:2px}
.goal-act{display:flex;gap:8px;margin-top:12px;align-items:center}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.step.add{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.spacer{flex:1}

.big{font-size:2.2rem;font-weight:800;color:var(--pine);line-height:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,26px);column-gap:3px;row-gap:3px;align-items:center}
.gh{text-align:center;font-size:.78rem;color:var(--ink2);line-height:1.15;padding-bottom:4px}
.gh b{display:block;font-size:.95rem;color:var(--ink)}
.gh.today b{color:var(--saffron)}
.gname{font-size:.86rem;font-weight:600;line-height:1.25;padding:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:transparent}
.cell.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.cell.miss{border-color:var(--bad);opacity:.7}
.cell.off{border:0;color:var(--line);cursor:default}
.cell:disabled{cursor:default;opacity:.55}
.sec{margin:22px 4px 0;font-weight:800;font-size:1.02rem}
.wrow{margin-top:10px}
.wrow .l{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.wrow .l span:last-child{color:var(--ink2);font-weight:600}

label.f,.f-lbl{display:block;margin-top:14px;font-size:.88rem;font-weight:700;color:var(--ink2)}
.in,select.in,textarea.in{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;color:var(--ink)}
textarea.in{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dchip{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;font-size:.92rem}
.dchip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin-top:12px;min-height:1.2em}
.hint{font-size:.84rem;color:var(--ink2);margin:6px 0 0}

.tabs{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76rem;font-weight:700;color:var(--ink2);position:relative}
.tab[aria-current="page"]{color:var(--pine)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--pine)}
.fab{position:fixed;left:max(16px,calc(50% - 264px));bottom:78px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--pine);color:var(--pine-ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6}

.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0 8px}
.sheet-head h2{margin:0 8px;font-size:1.15rem}
.sheet-body{padding:0 16px 8px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .primary{flex:1}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function(){
'use strict';

/* ---------- ثوابت وأدوات ---------- */
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const INIT=['ح','ن','ث','ر','خ','ج','س'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const BYDAY=['SU','MO','TU','WE','TH','FR','SA'];

/* ---------- آيات وأحاديث ---------- */
const BENEFITS=[
  {text:'«حاسبوا أنفسكم قبل أن تحاسبوا، وزنوها قبل أن توزنوا، وتزينوا للعرض الأكبر»',src:'عمر بن الخطاب رضي الله عنه',label:'أثر شريف'},
  {text:'﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنظُرْ نَفْسٌ مَّا قَدَّمَتْ لِغَدٍ ۖ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ﴾',src:'سورة الحشر: 18',label:'آية كريمة'},
  {text:'﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾',src:'سورة العنكبوت: 69',label:'آية كريمة'},
  {text:'«إن الله يحب إذا عمل أحدكم عملاً أن يتقنه»',src:'رواه الطبراني والبيهقي',label:'حديث شريف'},
  {text:'﴿فَإِذَا فَرَغْتَ فَانصَبْ - وَإِلَى رَبِّكَ فَارْغَب﴾',src:'سورة الشرح: 7-8',label:'آية كريمة'},
  {text:'«احرص على ما ينفعك، واستعن بالله ولا تعجز»',src:'رواه مسلم',label:'حديث شريف'},
  {text:'﴿إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنفُسِهِمْ﴾',src:'سورة الرعد: 11',label:'آية كريمة'},
  {text:'«خير الناس أنفعهم للناس»',src:'رواه الطبراني',label:'حديث شريف'},
  {text:'﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَى﴾',src:'سورة النجم: 39',label:'آية كريمة'},
  {text:'«نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ»',src:'رواه البخاري',label:'حديث شريف'},

function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  const kids=flat([].slice.call(arguments,2));
  for(let n=0;n<kids.length;n++){const c=kids[n];if(c==null||c===false)continue;e.appendChild(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}

const runsOn=(i,k)=>i.days.includes(parse(k).getDay())&&(!i.since||i.since<=k);
function cmpItems(a,b){
  const A=toMin(a.start),B=toMin(b.start);
  if(A===null&&B===null)return S.items.indexOf(a)-S.items.indexOf(b);
  if(A===null)return -1;if(B===null)return 1;
  if(A!==B)return A-B;
  return S.items.indexOf(a)-S.items.indexOf(b);
}
function moveItem(srcId,tgtId){
  if(srcId===tgtId)return;
  const srcIdx=S.items.findIndex(i=>i.id===srcId);
  const tgtIdx=S.items.findIndex(i=>i.id===tgtId);
  if(srcIdx<0||tgtIdx<0)return;
  const src=S.items[srcIdx],tgt=S.items[tgtIdx];
  if(src.start&&tgt.start&&src.start!==tgt.start){
    const tmpS=src.start,tmpE=src.end;
    src.start=tgt.start;src.end=tgt.end;
    tgt.start=tmpS;tgt.end=tmpE;
  }
  const [moved]=S.items.splice(srcIdx,1);
  const newTgtIdx=S.items.findIndex(i=>i.id===tgtId);
  S.items.splice(srcIdx<tgtIdx?newTgtIdx+1:newTgtIdx,0,moved);
  save();
  render();
}
function shiftHour(t,delta){
  const m=toMin(t);
  if(m===null)return t;
  return minHM((m+delta*60+1440)%1440);
}
function applyDaylightSaving(targetMode){
  const currentMode=S.settings.timeMode||'winter';
  const isTargetSummer=targetMode==='summer';
  const modeLabel=isTargetSummer?'التوقيت الصيفي (+1 ساعة)':'التوقيت الشتوي (-1 ساعة)';
  const delta=isTargetSummer?1:-1;
  const timedItems=S.items.filter(i=>i.start||i.end);

  if(!timedItems.length){
    S.settings.timeMode=targetMode;
    save();
    render();
    alert('تم ضبط الوضع على '+(isTargetSummer?'التوقيت الصيفي':'التوقيت الشتوي')+'، ولا توجد مهام محددة بساعات حالياً.');
    return;
  }

  let confirmMsg='';
  if(currentMode===targetMode){
    confirmMsg='التطبيق مضبوط بالفعل على '+(isTargetSummer?'التوقيت الصيفي':'التوقيت الشتوي')+'.\nهل تريد '+(isTargetSummer?'تقديم':'تأخير')+' مواعيد جميع المهام ساعة إضافية على أي حال؟ ('+timedItems.length+' مهمة)';
  } else {
    confirmMsg='هل تريد تطبيق '+modeLabel+' على جميع المهام؟\nسيتم تعديل مواعيد '+timedItems.length+' مهمة تلقائياً.';
  }

  if(!window.confirm(confirmMsg)) return;

  let count=0;
  S.items.forEach(i=>{
    let changed=false;
    if(i.start){ i.start=shiftHour(i.start,delta); changed=true; }
    if(i.end){ i.end=shiftHour(i.end,delta); changed=true; }
    if(changed) count++;
  });

  S.settings.timeMode=targetMode;
  save();
  render();
  setTimeout(()=>{
    alert('تم بنجاح تعديل مواعيد '+count+' مهمة إلى '+(isTargetSummer?'التوقيت الصيفي (+1 ساعة)':'التوقيت الشتوي (-1 ساعة)')+'!');
  },100);
}

const isDone=(k,id)=>!!(S.log[k]&&S.log[k][id]);
function toggle(k,id){
  S.log[k]=S.log[k]||{};
  if(S.log[k][id])delete S.log[k][id];else S.log[k][id]=1;

function streak(i){
  let n=0,d=today();const t=todayKey();
  for(let c=0;c<400;c++){
    const k=key(d);if(i.since&&k<i.since)break;
    if(i.days.includes(d.getDay())){if(isDone(k,i.id))n++;else if(k!==t)break;}
    d=addDays(d,-1);
  }
  return n;
}
function goalCount(g,from,to){
  let n=0;
  for(const e of g.entries){if((!from||e.d>=from)&&(!to||e.d<=to))n+=e.n;}
  const ids=new Set(S.items.filter(i=>i.goal===g.id).map(i=>i.id));
  if(ids.size)for(const k in S.log){
    if((from&&k<from)||(to&&k>to))continue;
    for(const id in S.log[k])if(ids.has(id))n++;
  }
  return n;
}
function pace(g){
  const total=goalCount(g),t=todayKey(),o={total};
  if(!g.target)return o;
  o.remaining=Math.max(0,g.target-total);
  if(o.remaining===0){o.done=true;return o;}
  if(g.deadline){const left=diffDays(t,g.deadline)+1;o.daysLeft=left;o.overdue=left<=0;if(left>0)o.need=o.remaining/left;}
  if(total>0){
    const elapsed=Math.max(1,diffDays(g.start||t,t)+1);
    const days=Math.ceil(o.remaining/(total/elapsed));
    o.eta=key(addDays(today(),days));
    o.late=!!(g.deadline&&o.eta>g.deadline);
  }
  return o;
}
const weekStartOf=k=>{const d=parse(k);return key(addDays(d,-((d.getDay()-S.settings.weekStart+7)%7)));};
const weekDays=k=>{const s=parse(weekStartOf(k));return [0,1,2,3,4,5,6].map(n=>key(addDays(s,n)));};
function deleteItem(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const g=it.goal&&S.goals.find(x=>x.id===it.goal);
  for(const k of Object.keys(S.log)){
    if(S.log[k][id]){if(g)g.entries.push({d:k,n:1});delete S.log[k][id];if(!Object.keys(S.log[k]).length)delete S.log[k];}
  }
  S.items=S.items.filter(i=>i.id!==id);
}

function readText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsText(f);});}
function download(name,text,type){
  const cap=window.Capacitor,P=cap&&cap.Plugins;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&P&&P.Filesystem&&P.Share){
    P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'})
      .then(r=>P.Share.share({title:name,files:[r.uri]}))
      .catch(()=>{});
    return;
  }
  const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:type||'application/octet-stream'})),download:name});
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function buildICS(until){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Muhasabati//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const t=todayKey();
  S.items.filter(i=>i.start&&i.days.length).forEach(i=>{
    let d=parse(i.since&&i.since>t?i.since:t);
    for(let n=0;n<7&&!i.days.includes(d.getDay());n++)d=addDays(d,1);
    const sm=toMin(i.start);let dur=i.end?(toMin(i.end)-sm+1440)%1440:30;if(!dur)dur=30;
    const em=sm+dur,ed=addDays(d,Math.floor(em/1440));
    const fm=(date,mins)=>key(date).replace(/-/g,'')+'T'+pad(Math.floor(mins/60)%24)+pad(mins%60)+'00';
    L.push('BEGIN:VEVENT','UID:'+i.id+'@muhasabati','DTSTAMP:'+stamp,
      'DTSTART:'+fm(d,sm),'DTEND:'+fm(ed,em%1440),
      'RRULE:FREQ=WEEKLY;BYDAY='+i.days.map(x=>BYDAY[x]).join(',')+(until?';UNTIL='+until.replace(/-/g,'')+'T235959':''),
      'SUMMARY:'+esc(i.name),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(i.name),'TRIGGER:-PT5M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

function getDayStats(k){
  const items=itemsOn(k);
  if(!items.length)return null;
  const done=items.filter(i=>isDone(k,i.id)).length;
  return {done,total:items.length,pct:Math.round(done/items.length*100)};
}
function viewCharts(){
  const p=h('div',{class:'page'});
  p.append(h('div',{class:'sec'},'إحصائياتك'));
  const ranges=[['week','آخر أسبوع'],['month','آخر شهر'],['3months','آخر 3 أشهر']];
  const tabsEl=h('div',{class:'chart-tabs'});
  ranges.forEach(([id,label])=>{
    tabsEl.appendChild(h('button',{class:'chart-tab'+(UI.chartRange===id?' active':''),onclick:()=>{UI.chartRange=id;render();}},label));
  });
  p.append(tabsEl);
  let days=[];
  const t=today();
  if(UI.chartRange==='week'){for(let i=6;i>=0;i--)days.push(key(addDays(t,-i)));}
  else if(UI.chartRange==='month'){for(let i=29;i>=0;i--)days.push(key(addDays(t,-i)));}
  else{for(let i=89;i>=0;i--)days.push(key(addDays(t,-i)));}
  const stats=days.map(k=>({k,s:getDayStats(k)}));
  const valid=stats.filter(x=>x.s);
  const avgPct=valid.length?Math.round(valid.reduce((s,x)=>s+x.s.pct,0)/valid.length):0;
  const best=valid.reduce((b,x)=>(!b||x.s.pct>b.s.pct)?x:b,null);
  const streak7=stats.slice(-7).filter(x=>x.s&&x.s.pct===100).length;
  const summRow=h('div',{style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px'});
  [[avgPct+'%','متوسط الإنجاز'],[best?best.s.pct+'%':'–','أفضل يوم'],[streak7+'/7','أيام مكتملة']].forEach(([v,l])=>{
    summRow.appendChild(h('div',{class:'card',style:'text-align:center;padding:10px 8px'},
      h('div',{style:'font-size:1.4rem;font-weight:800;color:var(--pine)'},v),

  if(UI.chartRange!=='week'){
    const weeks=[];
    for(let i=0;i<days.length;i+=7){
      const slice=days.slice(i,i+7);
      const ss=slice.map(k=>getDayStats(k)).filter(Boolean);
      const avg=ss.length?Math.round(ss.reduce((s,x)=>s+x.pct,0)/ss.length):0;
      const d=parse(slice[0]);
      weeks.push({label:d.getDate()+'/'+pad(d.getMonth()+1),pct:avg,hasData:ss.length>0});
    }
    const maxPct=Math.max(...weeks.map(w=>w.pct),1);
    weeks.forEach(w=>{
      const col=h('div',{class:'chart-col'});

      const bw=h('div',{class:'chart-bar-wrap'});

      bar.style.height=(w.hasData?Math.max(4,Math.round(w.pct/maxPct*100)):4)+'%';
      bw.appendChild(bar);col.appendChild(bw);
      col.appendChild(h('div',{class:'chart-lbl'},w.label));
      barsEl.appendChild(col);
    });
  }else{
    stats.forEach(({k,s})=>{
      const d=parse(k);const isT=k===todayKey();

      col.appendChild(h('div',{class:'chart-pct'},s?s.pct+'%':''));
      const bw=h('div',{class:'chart-bar-wrap'});
      const bar=h('div',{class:'chart-bar'+((!s||s.pct===0)?' zero':'')});
      if(isT)bar.style.background='var(--saffron)';
      bar.style.height=(s?Math.max(4,s.pct):4)+'%';
      bw.appendChild(bar);col.appendChild(bw);
      col.appendChild(h('div',{class:'chart-lbl'},INIT[d.getDay()]));
      barsEl.appendChild(col);
    });

  const legend=h('div',{class:'chart-legend'});

  legend.appendChild(h('span',null,h('i',{style:'background:var(--saffron)'}),h('span',null,'اليوم')));
  legend.appendChild(h('span',null,h('i',{style:'background:var(--soft)'}),h('span',null,'بدون بيانات')));
  p.append(legend);
  if(valid.length){
    p.append(h('div',{class:'sec'},'أكثر العناصر التزاماً'));

        iStats[i.id].due++;

    if(sorted.length){

      });
      p.append(card);
    }
  }
  return p;
}

let activeDragId=null;
function setupDrag(rowEl,handleEl,itemId){
  rowEl.setAttribute('draggable','true');
  rowEl.dataset.id=itemId;

  rowEl.ondragstart=e=>{
    activeDragId=itemId;
    e.dataTransfer.setData('text/plain',itemId);
    e.dataTransfer.effectAllowed='move';
    rowEl.classList.add('dragging');
  };
  rowEl.ondragend=()=>{
    activeDragId=null;
    rowEl.classList.remove('dragging');
    document.querySelectorAll('.item.drag-over').forEach(el=>el.classList.remove('drag-over'));
  };
  rowEl.ondragover=e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    if(activeDragId&&activeDragId!==itemId){
      rowEl.classList.add('drag-over');
    }
  };
  rowEl.ondragleave=()=>{
    rowEl.classList.remove('drag-over');
  };
  rowEl.ondrop=e=>{
    e.preventDefault();
    rowEl.classList.remove('drag-over');
    const srcId=e.dataTransfer.getData('text/plain')||activeDragId;
    if(srcId&&srcId!==itemId){
      moveItem(srcId,itemId);
    }
  };

  // سحب باللمس على شاشات الهواتف (Touch drag)
  let isTouchDragging=false,currentTargetEl=null;
  handleEl.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    activeDragId=itemId;
    isTouchDragging=true;
    rowEl.classList.add('dragging');
    if(navigator.vibrate)navigator.vibrate(25);
  },{passive:true});

  handleEl.addEventListener('touchmove',e=>{
    if(!isTouchDragging||e.touches.length!==1)return;
    const touch=e.touches[0];
    e.preventDefault();
    const elemBelow=document.elementFromPoint(touch.clientX,touch.clientY);
    const targetRow=elemBelow?elemBelow.closest('.item[data-id]'):null;
    if(currentTargetEl&&currentTargetEl!==targetRow){
      currentTargetEl.classList.remove('drag-over');
    }
    if(targetRow&&targetRow.dataset.id!==itemId){
      targetRow.classList.add('drag-over');
      currentTargetEl=targetRow;
    }else{
      currentTargetEl=null;
    }
  },{passive:false});

  const endTouch=()=>{
    if(!isTouchDragging)return;
    isTouchDragging=false;
    rowEl.classList.remove('dragging');
    if(currentTargetEl){
      currentTargetEl.classList.remove('drag-over');
      const tgtId=currentTargetEl.dataset.id;
      if(tgtId&&tgtId!==itemId){
        moveItem(itemId,tgtId);
      }
      currentTargetEl=null;
    }
    activeDragId=null;
  };
  handleEl.addEventListener('touchend',endTouch);
  handleEl.addEventListener('touchcancel',endTouch);
}

function goalCard(g){
  const o=pace(g),tk=todayKey(),wk=weekDays(tk);
  const pct=g.target?Math.min(100,Math.round(o.total/g.target*100)):0;
  let chip=null;
  if(g.target){
    if(o.done)chip=h('span',{class:'pill ok'},'خلص');
    else if(o.overdue)chip=h('span',{class:'pill bad'},'الموعد عدّى');
    else if(o.total===0)chip=h('span',{class:'pill'},'لسه ما بدأتش');
    else if(o.late)chip=h('span',{class:'pill bad'},'متأخر');
    else chip=h('span',{class:'pill ok'},'على المسار');
  }
  const lines=[];
  if(g.target&&!o.done){
    lines.push('المتبقي '+num(o.remaining)+' '+g.unit);
    if(o.need)lines.push('محتاج '+num(o.need)+' '+g.unit+' في اليوم لحد '+fmtDate(g.deadline));
    if(o.eta)lines.push('بالسرعة الحالية هتخلص '+fmtDate(o.eta));
  }
  if(g.weekly){lines.push('الأسبوع ده: '+num(goalCount(g,wk[0],wk[6]))+' من '+g.weekly+' '+g.unit);}
  return h('div',{class:'card'},
    h('div',{class:'goal-top'},h('div',null,h('div',{class:'goal-name'},g.name),g.outcome?h('div',{class:'goal-out'},'المخرج: '+g.outcome):null),chip),
    g.target?h('div',{class:'bar',role:'progressbar','aria-valuenow':String(pct),'aria-valuemin':'0','aria-valuemax':'100'},h('i',{style:'width:'+pct+'%'})):null,
    h('div',{class:'goal-num',style:g.target?'':'margin-top:10px'},num(o.total),g.target?h('small',null,' من '+num(g.target)+' '+g.unit):h('small',null,' '+g.unit)),
    lines.length?h('ul',{class:'goal-lines'},lines.map(l=>h('li',null,l))):null,

      h('button',{class:'step add','aria-label':'زوّد واحد',onclick:()=>{g.entries.push({d:tk,n:1});save();render();}},icon('plus')),

    h('div',{class:'card'},
      h('p',{class:'hint',style:'margin:0'},'يطلع ملف فيه كل عناصرك اللي ليها وقت كمواعيد أسبوعية متكررة، وتفتحه في تقويم جوجل أو أي تقويم.'),
      field('المواعيد تنتهي في',until),
      h('div',{class:'btnrow',style:'margin-top:12px'},
        h('button',{class:'btn primary',onclick:()=>{
          if(!S.items.some(i=>i.start)){msg.textContent='مفيش عناصر ليها وقت.';return;}
          download('muhasabati-calendar.ics',buildICS(until.value),'text/calendar');}},'تصدير ملف التقويم'))),
    h('div',{class:'sec'},'قوالب وقوائم إسلامية'),
    h('div',{class:'card'},
      h('div',{class:'btnrow'},
        h('button',{class:'btn primary',onclick:openQuickListsSheet},'📿 قوائم إسلامية جاهزة'),
        h('button',{class:'btn',onclick:()=>{applyTemplate();UI.tab='today';render();}},'أضف قالب خطتي الحالية'),
        twoStep('مسح كل البيانات','اضغط تاني للمسح',()=>{S=blank();save();UI.tab='today';render();})),
      h('p',{class:'hint'},'القوالب والقوائم بيتضافوا على اللي عندك، ومش بيمسحوا حاجة.')));
  return p;
}

/* ---------- الهيكل ---------- */
const TABS=[
  ['today','اليوم','today'],
  ['goals','الأهداف','goals'],
  ['week','الأسبوع','week'],
  ['charts','الإحصاء','chart'],
  ['more','الإعدادات','more']
];
function render(){
  const y=window.scrollY,app=$('#app');
  const kids=[h('div',{class:'top'},h('div',{class:'brand'},'محاسبتي'))];
  if(mode==='memory')kids.push(h('div',{class:'banner',role:'status'},'الحفظ التلقائي مش متاح في المتصفح ده. صدّر نسخة من الإعدادات قبل ما تقفل.'));
  if(UI.tab==='today'){kids.push(renderBenefitBanner());}
  if(UI.tab==='today')kids.push(viewToday());
  else if(UI.tab==='goals')kids.push(viewGoals());
  else if(UI.tab==='week')kids.push(viewWeek());
  else if(UI.tab==='charts')kids.push(viewCharts());
  else kids.push(viewSettings());
  if(UI.tab==='today'||UI.tab==='goals')
    kids.push(h('button',{class:'fab','aria-label':UI.tab==='today'?'عنصر جديد':'هدف جديد',onclick:()=>UI.tab==='today'?itemEditor(null):goalEditor(null)},icon('plus',26)));
  kids.push(h('nav',{class:'tabs','aria-label':'التنقل'},TABS.map(t=>h('button',{class:'tab','aria-current':UI.tab===t[0]?'page':null,onclick:()=>{UI.tab=t[0];closeSheet();removeTip();render();window.scrollTo(0,0);}},icon(t[2],24),t[1]))));
  while(app.firstChild)app.removeChild(app.firstChild);
  kids.forEach(k=>app.appendChild(k));
  window.scrollTo(0,y);
}

store.get().then(d=>{S=normalize(d);render();
  setInterval(()=>{if(!sheetEl&&UI.tab==='today'&&UI.date===todayKey()&&!document.hidden&&!document.activeElement.matches('input,textarea,select'))render();},60000);
  setInterval(()=>{if(!sheetEl&&UI.tab==='today'&&!document.hidden)changeBenefit(1);},7000);
  try{
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
      window.Capacitor.Plugins.App.addListener('backButton',()=>{
        if(sheetEl){closeSheet();return;}
        if(tipEl){removeTip();return;}
        if(UI.tab!=='today'){UI.tab='today';render();return;}
        window.Capacitor.Plugins.App.exitApp();
      });
    }
  }catch(e){}
});
})();
</script>
