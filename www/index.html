<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5B4E">
<meta name="color-scheme" content="light dark">
<title>محاسبتي</title>
<style>
:root{
  --bg:#EBF0EE; --surface:#FAFBFA; --ink:#14302A; --ink2:#566D66; --line:#D1DCD8; --soft:#DFE8E5;
  --pine:#1E5B4E; --pine-ink:#FFFFFF; --saffron:#C97F12; --ok:#2C8A6C; --bad:#B4483B;
  --overlay:rgba(12,26,22,.52);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1A17; --surface:#15241F; --ink:#E4EFEB; --ink2:#93A9A2; --line:#264039; --soft:#1D302A;
    --pine:#5CBFA4; --pine-ink:#0E1A17; --saffron:#E8B04E; --ok:#5CBFA4; --bad:#E48C7E;
    --overlay:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
  font-family:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.t{direction:ltr;unicode-bidi:isolate;display:inline-block}
.ico{display:inline-flex;vertical-align:middle}

.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.top{padding:calc(16px + env(safe-area-inset-top)) 18px 4px}
.brand{font-size:1.4rem;font-weight:800;color:var(--pine)}
.page{padding:6px 16px 0}
.banner{margin:8px 16px 0;padding:10px 12px;border:1px solid var(--saffron);border-radius:12px;font-size:.88rem}

.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:active{background:var(--soft)}
.datetxt{text-align:center;flex:1}
.dt-main{font-weight:800;font-size:1.12rem}
.dt-sub{font-size:.85rem;color:var(--ink2)}
.link{color:var(--pine);font-weight:700;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;min-height:28px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px 18px}
.hero-top{display:flex;align-items:baseline;gap:8px}
.hero-num{font-size:2.7rem;font-weight:800;line-height:1;color:var(--pine)}
.hero-of{color:var(--ink2);font-weight:600}
.seg{display:flex;gap:3px;height:12px;margin-top:14px}
.seg i{flex:1;border-radius:3px;background:var(--soft)}
.seg i.on{background:var(--pine)}
.hero-cap{margin-top:10px;font-size:.92rem;color:var(--ink2)}

.grp{margin:20px 4px 4px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.chk{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}
.chk.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.item-body{flex:1;min-width:0;text-align:right;padding:4px 0}
.item-name{font-weight:700}
.item.done .item-name{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.item-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--ink2);margin-top:1px}
.tag{border:1px solid var(--line);border-radius:99px;padding:0 8px}
.now{background:var(--saffron);color:#fff;border-radius:99px;padding:0 8px;font-weight:700}
@media (prefers-color-scheme: dark){.now{color:#1b1204}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:20px 18px;margin-top:14px}
.empty h2{margin:0 0 6px;font-size:1.1rem}
.empty p{margin:0 0 14px;color:var(--ink2)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:40px;padding:6px 14px}

.goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal-name{font-weight:800;font-size:1.05rem}
.goal-out{font-size:.88rem;color:var(--ink2);margin-top:2px}
.pill{font-size:.76rem;padding:1px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--pine);border-radius:99px}
.bar.wk>i{background:var(--saffron)}
.goal-num{font-weight:800;font-size:1.25rem}
.goal-num small{font-weight:600;color:var(--ink2);font-size:.9rem}
.goal-lines{margin:6px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--ink2)}
.goal-lines li+li{margin-top:2px}
.goal-act{display:flex;gap:8px;margin-top:12px;align-items:center}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.step.add{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.spacer{flex:1}

.big{font-size:2.2rem;font-weight:800;color:var(--pine);line-height:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,26px);column-gap:3px;row-gap:3px;align-items:center}
.gh{text-align:center;font-size:.78rem;color:var(--ink2);line-height:1.15;padding-bottom:4px}
.gh b{display:block;font-size:.95rem;color:var(--ink)}
.gh.today b{color:var(--saffron)}
.gname{font-size:.86rem;font-weight:600;line-height:1.25;padding:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:transparent}
.cell.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.cell.miss{border-color:var(--bad);opacity:.7}
.cell.off{border:0;color:var(--line);cursor:default}
.cell:disabled{cursor:default;opacity:.55}
.sec{margin:22px 4px 0;font-weight:800;font-size:1.02rem}
.wrow{margin-top:10px}
.wrow .l{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.wrow .l span:last-child{color:var(--ink2);font-weight:600}

label.f{display:block;margin-top:14px;font-size:.88rem;font-weight:700;color:var(--ink2)}
.in,select.in,textarea.in{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;color:var(--ink)}
textarea.in{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dchip{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;font-size:.92rem}
.dchip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin-top:12px;min-height:1.2em}
.hint{font-size:.84rem;color:var(--ink2);margin:6px 0 0}

.tabs{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76rem;font-weight:700;color:var(--ink2);position:relative}
.tab[aria-current="page"]{color:var(--pine)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--pine)}
.fab{position:fixed;left:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--pine);color:var(--pine-ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6}

.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0 8px}
.sheet-head h2{margin:0 8px;font-size:1.15rem}
.sheet-body{padding:0 16px 8px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .primary{flex:1}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function(){
'use strict';

/* ---------- ثوابت وأدوات ---------- */
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const INIT=['ح','ن','ث','ر','خ','ج','س'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const BYDAY=['SU','MO','TU','WE','TH','FR','SA'];
const $=(s,r)=>(r||document).querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const todayKey=()=>key(today());
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const fmtDate=k=>{const d=parse(k);return d.getDate()+' '+MONTHS[d.getMonth()];};
const fmtFull=k=>{const d=parse(k);return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const toMin=t=>{if(!t)return null;const p=t.split(':').map(Number);return p[0]*60+p[1];};
const minHM=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const num=n=>{const r=Math.round(n*10)/10;return String(r);};

/* ---------- أيقونات ---------- */
const SVG={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  today:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>',
  goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  week:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
  more:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
function icon(n,s){s=s||22;const e=document.createElement('span');e.className='ico';
  e.innerHTML='<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+SVG[n]+'</svg>';return e;}

/* ---------- بناء العناصر ---------- */
function flat(a){return a.reduce((r,x)=>Array.isArray(x)?r.concat(flat(x)):r.concat([x]),[]);}
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  const kids=flat([].slice.call(arguments,2));
  for(let n=0;n<kids.length;n++){const c=kids[n];if(c==null||c===false)continue;e.appendChild(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
const tspan=(a,b)=>h('span',{class:'t'},a+(b?' – '+b:''));

/* ---------- التخزين ---------- */
const KEY='muhasabati.v1';
let mode='memory',memory=null;
const store={
  async get(){
    try{
      if(window.storage&&window.storage.get){
        mode='claude';
        try{const r=await window.storage.get(KEY);return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;}
      }
    }catch(e){}
    try{const v=window.localStorage.getItem(KEY);mode='local';return v?JSON.parse(v):null;}
    catch(e){mode='memory';return memory;}
  },
  async set(v){
    memory=v;
    try{
      if(mode==='claude')await window.storage.set(KEY,JSON.stringify(v));
      else if(mode==='local')window.localStorage.setItem(KEY,JSON.stringify(v));
    }catch(e){mode='memory';}
  }
};
let timer=null;
const save=()=>{clearTimeout(timer);store.set(S);};
const saveSoon=()=>{clearTimeout(timer);timer=setTimeout(()=>store.set(S),300);};
window.addEventListener('pagehide',()=>{if(S)save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});

/* ---------- الحالة ---------- */
let S=null;
const UI={tab:'today',date:todayKey(),anchor:todayKey()};
const blank=()=>({v:1,items:[],goals:[],log:{},reviews:{},settings:{weekStart:6}});
function normalize(d){
  const s=Object.assign(blank(),d||{});
  s.settings=Object.assign({weekStart:6},s.settings||{});
  s.items=(s.items||[]).map(i=>Object.assign({id:uid(),name:'',days:[0,1,2,3,4,5,6],start:'',end:'',goal:null,since:''},i));
  s.goals=(s.goals||[]).map(g=>Object.assign({id:uid(),name:'',unit:'',target:0,start:todayKey(),deadline:'',weekly:0,group:'',outcome:'',entries:[]},g));
  s.log=s.log||{};s.reviews=s.reviews||{};
  return s;
}

/* ---------- منطق ---------- */
const runsOn=(i,k)=>i.days.includes(parse(k).getDay())&&(!i.since||i.since<=k);
function cmpItems(a,b){
  const A=toMin(a.start),B=toMin(b.start);
  if(A===null&&B===null)return a.name.localeCompare(b.name,'ar');
  if(A===null)return -1;if(B===null)return 1;return A-B;
}
const itemsOn=k=>S.items.filter(i=>runsOn(i,k)).sort(cmpItems);
const isDone=(k,id)=>!!(S.log[k]&&S.log[k][id]);
function toggle(k,id){
  S.log[k]=S.log[k]||{};
  if(S.log[k][id])delete S.log[k][id];else S.log[k][id]=1;
  if(!Object.keys(S.log[k]).length)delete S.log[k];
  save();
}
function streak(i){
  let n=0,d=today();const t=todayKey();
  for(let c=0;c<400;c++){
    const k=key(d);if(i.since&&k<i.since)break;
    if(i.days.includes(d.getDay())){if(isDone(k,i.id))n++;else if(k!==t)break;}
    d=addDays(d,-1);
  }
  return n;
}
function goalCount(g,from,to){
  let n=0;
  for(const e of g.entries){if((!from||e.d>=from)&&(!to||e.d<=to))n+=e.n;}
  const ids=new Set(S.items.filter(i=>i.goal===g.id).map(i=>i.id));
  if(ids.size)for(const k in S.log){
    if((from&&k<from)||(to&&k>to))continue;
    for(const id in S.log[k])if(ids.has(id))n++;
  }
  return n;
}
function pace(g){
  const total=goalCount(g),t=todayKey(),o={total};
  if(!g.target)return o;
  o.remaining=Math.max(0,g.target-total);
  if(o.remaining===0){o.done=true;return o;}
  if(g.deadline){const left=diffDays(t,g.deadline)+1;o.daysLeft=left;o.overdue=left<=0;if(left>0)o.need=o.remaining/left;}
  if(total>0){
    const elapsed=Math.max(1,diffDays(g.start||t,t)+1);
    const days=Math.ceil(o.remaining/(total/elapsed));
    o.eta=key(addDays(today(),days));
    o.late=!!(g.deadline&&o.eta>g.deadline);
  }
  return o;
}
const weekStartOf=k=>{const d=parse(k);return key(addDays(d,-((d.getDay()-S.settings.weekStart+7)%7)));};
const weekDays=k=>{const s=parse(weekStartOf(k));return [0,1,2,3,4,5,6].map(n=>key(addDays(s,n)));};
function deleteItem(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const g=it.goal&&S.goals.find(x=>x.id===it.goal);
  for(const k of Object.keys(S.log)){
    if(S.log[k][id]){if(g)g.entries.push({d:k,n:1});delete S.log[k][id];if(!Object.keys(S.log[k]).length)delete S.log[k];}
  }
  S.items=S.items.filter(i=>i.id!==id);
}
function deleteGoal(id){S.goals=S.goals.filter(g=>g.id!==id);S.items.forEach(i=>{if(i.goal===id)i.goal=null;});}

/* ---------- القالب الجاهز ---------- */
function applyTemplate(){
  const t=todayKey(),dl=key(addDays(today(),14));
  const G=o=>Object.assign({id:uid(),name:'',unit:'',target:0,start:t,deadline:'',weekly:0,group:'',outcome:'',entries:[]},o);
  const ac=G({name:'دروس الأكاديمية',unit:'درس',target:16,deadline:dl,weekly:10,group:'المرحلة الأولى',outcome:'ترم الأكاديمية مخلص'});
  const ng=G({name:'فيديوهات أنجولار',unit:'فيديو',target:8,deadline:dl,weekly:6,group:'المرحلة الأولى',outcome:'مشروع صغير يجمع السيجنال والأداء'});
  const sd=G({name:'سيستم ديزاين',unit:'تصميم',target:6,weekly:1,group:'المرحلة الثانية',outcome:'6 أنظمة مصممة ومكتوبة'});
  const be=G({name:'الباك إند',unit:'مشروع',target:1,group:'المرحلة الثالثة',outcome:'واجهة برمجية صغيرة كاملة'});
  S.goals.push(ac,ng,sd,be);
  const ALL=[0,1,2,3,4,5,6],ST=[6,0,1,2,3,4],SW=[0,1,2,3],TH=[4],FR=[5],FS=[5,6],STUDY=[6,0,1,2,3,5];
  const I=(name,days,start,end,goal)=>S.items.push({id:uid(),name,days,start:start||'',end:end||'',goal:goal?goal.id:null,since:t});
  I('الصلوات في المسجد',ALL);
  I('قيام الليل',ALL,'23:30','00:50');
  I('نوم الليل',ALL,'01:00','05:00');
  I('الفجر وأذكار الصباح وركعتين الضحى',ALL,'05:30','07:10');
  I('الجزء الأول من القرآن',ALL,'07:10','07:50');
  I('نوم الصبح',ST,'08:00','11:00');
  I('نوم الصبح',FR,'08:00','10:00');
  I('أنجولار: مشاهدة الفيديو',ST,'11:30','12:35',ng);
  I('أنجولار: تطبيق على السيجنال',ST,'13:00','13:30');
  I('درس الأكاديمية الأول',ST,'13:45','15:00',ac);
  I('أذكار المساء والجزء الثاني',ALL,'16:15','17:05');
  I('علم شرعي مع كتابة الملخص',STUDY,'17:10','18:15');
  I('درس المسجد',TH,'18:25','20:15');
  I('درس الأكاديمية الثاني',SW,'20:15','21:30',ac);
  I('المقرأة بعد العشاء',FS,'20:00','21:00');
  I('كتابة ملخص درس المسجد',TH,'21:15','21:45');
  I('المسجد وصلاة الجمعة',FR,'10:40','13:30');
  I('نوم الجمعة',FR,'13:30','14:30');

function readText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsText(f);});}
function download(name,text,type){
  const cap=window.Capacitor,P=cap&&cap.Plugins;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&P&&P.Filesystem&&P.Share){
    P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'})
      .then(r=>P.Share.share({title:name,files:[r.uri]}))
      .catch(()=>{});
    return;
  }
  const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:type||'application/octet-stream'})),download:name});
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function buildICS(until){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Muhasabati//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const t=todayKey();
  S.items.filter(i=>i.start&&i.days.length).forEach(i=>{
    let d=parse(i.since&&i.since>t?i.since:t);
    for(let n=0;n<7&&!i.days.includes(d.getDay());n++)d=addDays(d,1);
    const sm=toMin(i.start);let dur=i.end?(toMin(i.end)-sm+1440)%1440:30;if(!dur)dur=30;
    const em=sm+dur,ed=addDays(d,Math.floor(em/1440));
    const fm=(date,mins)=>key(date).replace(/-/g,'')+'T'+pad(Math.floor(mins/60)%24)+pad(mins%60)+'00';
    L.push('BEGIN:VEVENT','UID:'+i.id+'@muhasabati','DTSTAMP:'+stamp,
      'DTSTART:'+fm(d,sm),'DTEND:'+fm(ed,em%1440),
      'RRULE:FREQ=WEEKLY;BYDAY='+i.days.map(x=>BYDAY[x]).join(',')+(until?';UNTIL='+until.replace(/-/g,'')+'T235959':''),
      'SUMMARY:'+esc(i.name),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(i.name),'TRIGGER:-PT5M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

function goalCard(g){
  const o=pace(g),tk=todayKey(),wk=weekDays(tk);

  if(g.target){
    if(o.done)chip=h('span',{class:'pill ok'},'خلص');
    else if(o.overdue)chip=h('span',{class:'pill bad'},'الموعد عدّى');
    else if(o.total===0)chip=h('span',{class:'pill'},'لسه ما بدأتش');
    else if(o.late)chip=h('span',{class:'pill bad'},'متأخر');
    else chip=h('span',{class:'pill ok'},'على المسار');
  }
  const lines=[];
  if(g.target&&!o.done){
    lines.push('المتبقي '+num(o.remaining)+' '+g.unit);

    h('div',{class:'goal-num',style:g.target?'':'margin-top:10px'},num(o.total),g.target?h('small',null,' من '+num(g.target)+' '+g.unit):h('small',null,' '+g.unit)),

    h('div',{class:'sec'},'التقويم'),
    h('div',{class:'card'},
      h('p',{class:'hint',style:'margin:0'},'يطلع ملف فيه كل عناصرك اللي ليها وقت كمواعيد أسبوعية متكررة، وتفتحه في تقويم جوجل أو أي تقويم.'),
      field('المواعيد تنتهي في',until),
      h('div',{class:'btnrow',style:'margin-top:12px'},
        h('button',{class:'btn primary',onclick:()=>{
          if(!S.items.some(i=>i.start)){msg.textContent='مفيش عناصر ليها وقت.';return;}
          download('muhasabati-calendar.ics',buildICS(until.value),'text/calendar');}},'تصدير ملف التقويم'))),
    h('div',{class:'sec'},'قوالب وإعادة ضبط'),
    h('div',{class:'card'},
      h('div',{class:'btnrow'},
        h('button',{class:'btn',onclick:()=>{applyTemplate();UI.tab='today';render();}},'أضف قالب خطتي الحالية'),
        twoStep('مسح كل البيانات','اضغط تاني للمسح',()=>{S=blank();save();UI.tab='today';render();})),
      h('p',{class:'hint'},'القالب بيتضاف على اللي عندك، ومش بيمسح حاجة.')));
  return p;
}

/* ---------- الهيكل ---------- */
const TABS=[['today','اليوم','today'],['goals','الأهداف','goals'],['week','الأسبوع','week'],['more','الإعدادات','more']];
function render(){
  const y=window.scrollY,app=$('#app');
  const kids=[h('div',{class:'top'},h('div',{class:'brand'},'محاسبتي'))];
  if(mode==='memory')kids.push(h('div',{class:'banner',role:'status'},'الحفظ التلقائي مش متاح في المتصفح ده. صدّر نسخة من الإعدادات قبل ما تقفل.'));
  kids.push(UI.tab==='today'?viewToday():UI.tab==='goals'?viewGoals():UI.tab==='week'?viewWeek():viewSettings());
  if(UI.tab==='today'||UI.tab==='goals')
    kids.push(h('button',{class:'fab','aria-label':UI.tab==='today'?'عنصر جديد':'هدف جديد',onclick:()=>UI.tab==='today'?itemEditor(null):goalEditor(null)},icon('plus',26)));
  kids.push(h('nav',{class:'tabs','aria-label':'التنقل'},TABS.map(t=>h('button',{class:'tab','aria-current':UI.tab===t[0]?'page':null,onclick:()=>{UI.tab=t[0];closeSheet();render();window.scrollTo(0,0);}},icon(t[2],24),t[1]))));
  while(app.firstChild)app.removeChild(app.firstChild);
  kids.forEach(k=>app.appendChild(k));
  window.scrollTo(0,y);
}

store.get().then(d=>{S=normalize(d);render();
  setInterval(()=>{if(!sheetEl&&UI.tab==='today'&&UI.date===todayKey()&&!document.hidden&&!document.activeElement.matches('input,textarea,select'))render();},60000);
});
})();
</script>
